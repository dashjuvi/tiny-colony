 const e0=1+.35*tcount(0)+.4*P('fert');const base={food:e0,wood:e0,stone:e0,gold:1+.35*tcount(2)+.4*P('tres'),sci:1+.35*tcount(2)+.4*P('schol')};
 for(const k of RES)MULT[k]=base[k]*em*wm*am*leg*evMult(k);
 const r={food:0,wood:0,stone:0,gold:0,sci:0};
 for(const t of G.tiles){if(t.o!==0)continue;const ty=TER[t.t].y;for(const k in ty)r[k]+=ty[k];
  if(t.city===2){r.food+=3;r.wood+=3;r.stone+=2;r.gold+=4;r.sci+=1}else if(t.city){r.food+=2;r.wood+=2;r.stone+=1;r.gold+=3;r.sci+=.6}

 const e=Math.floor(Math.log10(n)/3);if(e<SUF.length)return(n/Math.pow(1000,e)).toFixed(2).replace(/\.?0+$/,'')+SUF[e];return n.toExponential(2)}
