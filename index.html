<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Colony</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiny Colony">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Tiny Colony - a free, ad-free idle ant game. Conquer the universe. No tracking, no purchases.">
<link rel="icon" id="favicon" href="data:,">
<link rel="apple-touch-icon" id="touchicon" href="">
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--h1:290px;--h2:520px;--acc:#51cf66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none;touch-action:manipulation;
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;color:#fff}
body{position:fixed;inset:0;width:100%}
button{font-family:inherit}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px);pointer-events:none}
#row1{display:flex;gap:8px;align-items:flex-start}
.pill{background:rgba(22,24,30,.84);color:#fff;border-radius:999px;padding:7px 13px 7px 10px;font-weight:800;font-size:17px;line-height:24px;
  display:flex;align-items:center;gap:6px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.16);
  border:0;white-space:nowrap}
.pill svg{width:21px;height:21px;flex:none}
#col{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
#rate{font-size:12px;font-weight:800;color:#7a8190;padding-left:12px;height:15px;text-shadow:0 0 4px rgba(255,255,255,.7)}
body.dk #rate{color:#9aa3bd;text-shadow:none}
#rjPill{margin-left:auto;pointer-events:auto;cursor:pointer;transition:box-shadow .3s}
#rjPill:active{transform:scale(.95)}
#rjPill.glow{box-shadow:0 0 0 2px #ffd43b,0 0 18px rgba(255,212,59,.75);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px #ffd43b,0 0 6px rgba(255,212,59,.4)}}
#stage{position:relative;height:28px;margin-top:2px;border-radius:999px;background:rgba(22,24,30,.84);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#stageFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);border-radius:999px;transition:width .25s linear,background .6s}
#stageTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
#stageTxt i{font-style:normal;opacity:.9}
#chips{position:absolute;left:calc(var(--sl) + 12px);top:100px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:3;pointer-events:none}
.chip{background:rgba(22,24,30,.84);color:#fff;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.16);border:0;white-space:nowrap}
.chip.gold{background:#ffd43b;color:#3a2e00;pointer-events:auto;cursor:pointer;animation:glow2 1.4s ease-in-out infinite}
@keyframes glow2{50%{transform:scale(1.05)}}
.chip.warp{background:#4dabf7;color:#06243d}
.chip.fren{background:#ff922b;color:#3d1d00}
#abil{position:absolute;right:calc(var(--sr) + 12px);bottom:300px;display:flex;flex-direction:column;gap:10px;z-index:4}
.ab{position:relative;width:58px;height:58px;border-radius:50%;border:0;padding:0;background:rgba(22,24,30,.9);color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:transform .08s}
.ab:active{transform:scale(.92)}
.ab svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ab svg.ring circle{fill:none;stroke-width:4}
.ab .rb{stroke:rgba(255,255,255,.14)}
.ab .rf{stroke:#3ddc84;stroke-linecap:round;transition:stroke-dashoffset .15s linear}
.ab.cd .rf{stroke:#8a91a1}
.ab.act .rf{stroke:#ffd43b}
.ab .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ab .ico svg{width:26px;height:26px}
.ab .tm{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-weight:900;font-size:11px;text-shadow:0 1px 2px #000}
.ab.ready{animation:glow2 1.8s ease-in-out infinite}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:5}
#content{position:relative;height:var(--h1);transition:height .25s ease;overflow:hidden}
#panel.tall #content{height:var(--h2);background:#f4f5f9;border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.2);color:#1b1e26}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 calc(var(--sr) + 10px) 10px calc(var(--sl) + 10px);display:none;overscroll-behavior:contain;touch-action:pan-y}
.page.on{display:block}
#panel.tall .page{padding-top:14px}
#pin{max-width:560px;margin:0 auto}
#bulkrow{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px;gap:8px}
#hint{color:#9aa1ad;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dk #hint{color:#9aa3bd}
#bulk{background:rgba(22,24,30,.84);color:#fff;border:0;border-radius:999px;padding:6px 14px;font:800 13px/16px inherit;font-family:inherit;cursor:pointer;flex:none}
#bulk:active{transform:scale(.94)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{position:relative;overflow:hidden;background:rgba(22,24,30,.92);color:#fff;border:0;border-radius:18px;padding:9px 11px 12px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:7px;min-height:66px;box-shadow:0 3px 10px rgba(0,0,0,.18);transition:opacity .15s,transform .08s}
.up:active{transform:scale(.96)}
.up.off{opacity:.58}
.up.hide{display:none}
.up.newu{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.r1,.r2{display:flex;align-items:center;gap:7px;width:100%}
.ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:16px;height:16px}
.nm{font-weight:800;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{color:#ffd43b;font-size:11px;margin-left:4px}
.lv{font-size:12px;font-weight:700;color:#aab1bf;white-space:nowrap}
.r2{justify-content:space-between}
.fx{font-size:12px;font-weight:700;color:#aab1bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost{font-weight:800;font-size:14px;border-radius:999px;padding:3px 10px;background:#3ddc84;color:#06240f;white-space:nowrap}
.off .cost{background:#454a57;color:#c3c8d3}
.maxed .cost{background:#ffd43b;color:#3a2e00}
.ms{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1)}
.ms i{display:block;height:100%;width:0;background:#ffd43b;border-radius:0 3px 3px 0}
#tabs{display:flex;gap:2px;padding:6px calc(var(--sr) + 8px) calc(var(--sb) + 6px) calc(var(--sl) + 8px);background:rgba(22,24,30,.96)}
.tab{position:relative;flex:1;border:0;background:none;color:#8a91a1;font:800 11px/1 inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 6px;border-radius:14px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:#fff;background:rgba(255,255,255,.1)}
.tab .dot{position:absolute;top:3px;left:calc(50% + 6px);width:10px;height:10px;border-radius:50%;background:#ff5d5d;border:2px solid #16181e;display:none}
.tab .dot.on{display:block}
/* sheets */
.sh{max-width:560px;margin:0 auto}
.sh h3{margin:14px 4px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7b8294;font-weight:900}
.sh h3:first-child{margin-top:0}
.box{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 1px 4px rgba(20,25,40,.08);margin-bottom:8px}
.rjhead{display:flex;align-items:center;gap:12px}
.rjhead .big{font-size:30px;font-weight:900;line-height:1;color:#b4237a}
.rjhead small{display:block;font-size:12px;font-weight:700;color:#6b7385;margin-top:3px}
.sk{display:flex;gap:11px;align-items:center;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(20,25,40,.08);cursor:pointer;border:2px solid transparent;transition:transform .08s}
.sk:active{transform:scale(.98)}
.sk .ic{width:42px;height:42px}
.sk .ic svg{width:23px;height:23px}
.sk .bd{flex:1;min-width:0}
.sk .tt{font-weight:900;font-size:15px;display:flex;gap:6px;align-items:center}
.sk .tt em{font-style:normal;font-size:11px;font-weight:800;color:#7b8294;background:#eef0f4;border-radius:999px;padding:1px 7px}
.sk .ds{font-size:12.5px;line-height:1.3;color:#566;font-weight:600;margin-top:2px}
.sk .rq{font-size:11.5px;font-weight:800;color:#d9480f;margin-top:3px}
.sk .go{flex:none;font-weight:900;font-size:14px;border-radius:999px;padding:6px 11px;background:#ffd6ec;color:#8a1857;white-space:nowrap}
.sk.can{border-color:#ff9ed2}
.sk.can .go{background:#e64a9e;color:#fff}
.sk.lock{opacity:.5}
.sk.own{background:#fff7e0}
.sk.own .go{background:#ffd43b;color:#3a2e00}
.sk.act .tt::after{content:"ACTIVE";font-size:9.5px;font-weight:900;letter-spacing:.06em;background:#4dabf7;color:#fff;border-radius:6px;padding:2px 5px}
.stg{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border-radius:16px;margin-bottom:6px;box-shadow:0 1px 4px rgba(20,25,40,.08)}
.stg .dotc{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff}
.stg .bd{flex:1;min-width:0}
.stg .nn{font-weight:900;font-size:15px}
.stg .ss{font-size:12px;font-weight:700;color:#6b7385;margin-top:1px}
.stg.cur{box-shadow:0 0 0 2px var(--acc),0 2px 8px rgba(20,25,40,.12)}
.stg.lk{opacity:.5}
.pbar{height:7px;border-radius:4px;background:#e6e9f0;margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:4px;width:0}
.ascbtn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:900 16px/1 inherit;font-family:inherit;margin-top:10px;cursor:pointer;background:linear-gradient(135deg,#ff6bb5,#ffb347);color:#fff;box-shadow:0 4px 14px rgba(230,74,158,.35)}
.ascbtn:active{transform:scale(.98)}
.ascbtn[disabled]{background:#d8dce6;color:#8a91a1;box-shadow:none;cursor:default}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;font-weight:700;border-bottom:1px solid #eef0f4}
.row:last-child{border:0}
.row span:last-child{color:#566;font-weight:800;text-align:right}
.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-weight:800;font-size:14px;border-bottom:1px solid #eef0f4}
.tg{width:48px;height:28px;border-radius:14px;background:#cfd3dc;border:0;position:relative;cursor:pointer;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:#3ddc84}.tg.on::after{transform:translateX(20px)}
.note{font-size:12.5px;line-height:1.45;color:#6b7385;font-weight:600;margin:6px 4px}
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-20px);opacity:0;z-index:12;pointer-events:none;background:rgba(22,24,30,.94);color:#fff;border-radius:16px;padding:10px 16px;font-weight:800;font-size:14px;text-align:center;max-width:86%;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-weight:700;font-size:12px;color:#c3c8d3;margin-top:2px}
#modal{position:absolute;inset:0;background:rgba(10,12,18,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal[hidden]{display:none}
.card{background:#fff;color:#1b1e26;border-radius:24px;padding:22px 22px 18px;width:100%;max-width:350px;max-height:92%;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.3);text-align:center;animation:cardin .25s ease-out}
@keyframes cardin{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:6px 0 12px;font-size:14px;line-height:1.4;color:#566}
.card .big{font-size:34px;font-weight:900;color:#12a150;margin:4px 0 2px}
.card .big.pk{color:#c2287f}
.card .stats{text-align:left;background:#f4f5f9;border-radius:14px;padding:6px 14px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font:800 16px/1 inherit;font-family:inherit;margin-top:8px;cursor:pointer;background:#1b1e26;color:#fff}
.btn:active{transform:scale(.97)}
.btn.good{background:#3ddc84;color:#06240f}
.btn.pink{background:linear-gradient(135deg,#ff6bb5,#ffb347);color:#fff}
.btn.ghost{background:#eef0f4;color:#1b1e26}
.btn.danger{background:#ff5d5d;color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="row1">
    <div id="col">
      <div class="pill" id="moneyPill">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#ffc83d"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="#e39a00" stroke-width="1.6"/><text x="12" y="16.6" text-anchor="middle" font-size="12.5" font-weight="900" fill="#b87400" font-family="Arial,sans-serif">$</text></svg>
        <span id="money">0</span>
      </div>
      <div id="rate"></div>
    </div>
    <div class="pill" id="antPill">
      <svg viewBox="-12 -9 24 18"><g id="antIco"></g></svg>
      <span id="ants">2</span>
    </div>
    <button class="pill" id="rjPill" aria-label="Royal Jelly">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l8 4.6v9.8l-8 4.6-8-4.6V7.1z" fill="#ff7cc3"/><path d="M12 2.5l8 4.6-8 4.6-8-4.6z" fill="#ffc2e4"/><path d="M12 11.7v9.8l-8-4.6V7.1z" fill="#e64a9e" opacity=".55"/></svg>
      <span id="rj">0</span>
    </button>
  </div>
  <div id="stage"><div id="stageFill"></div><div id="stageTxt"><span id="stName">Backyard</span><i id="stPct">0%</i></div></div>
</div>
<div id="chips"></div>
<div id="abil"></div>
<div id="toast"></div>
<div id="panel">
  <div id="content">
    <div class="page on" id="p0"><div id="pin">
      <div id="bulkrow"><span id="hint">Tap the food for crumbs</span><button id="bulk">Buy x1</button></div>
      <div id="grid"></div>
    </div></div>
    <div class="page" id="p1"><div class="sh" id="skillsBox"></div></div>
    <div class="page" id="p2"><div class="sh" id="conqBox"></div></div>
    <div class="page" id="p3"><div class="sh" id="setBox"></div></div>

</div>
<div id="modal" hidden><div class="card" id="card"></div></div>

<script>
(()=>{
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
let SCI=false;
function fmt(n){
  if(!isFinite(n))return'∞';
  if(n<0)return'-'+fmt(-n);
  if(n<10)return n.toFixed(1).replace(/\.0$/,'');
  if(n<1000)return String(Math.round(n));
  if(SCI||n>=1e66)return n.toExponential(2).replace('e+','e');
  let k=Math.floor(Math.log10(n)/3);
  let v=n/Math.pow(1000,k);
  if(v>=999.5&&k+1<SUF.length){k++;v=n/Math.pow(1000,k);}
  return(v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0))+SUF[k];
}
const fmtPct=v=>v>=10?Math.round(v)+'%':(Math.round(v*10)/10)+'%';
const fmtX=v=>v<10?(Math.round(v*100)/100)+'':fmt(v);
function fmtTime(s){s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:m?`${m}m ${s%60}s`:`${s}s`;}

/* ---- economy model (pure; no DOM) ---- */
const START_ANTS=2,BASE_CAP=148,SIM_ANTS=70;
const UP={
  speed:   {name:'Speed',     base:30,   g:1.7, max:40,      unl:0,   color:'#4dabf7'},
  workers: {name:'Workers',   base:15,   g:1.24,max:BASE_CAP,unl:0,   color:'#ffa94d'},
  strength:{name:'Strength',  base:50,   g:1.8, max:Infinity,unl:0,   color:'#ff6b6b'},
  income:  {name:'Income',    base:500,  g:2.6, max:Infinity,unl:0,   color:'#51cf66'},
  capacity:{name:'Capacity',  base:900,  g:2.3, max:Infinity,unl:600, color:'#be4bdb'},
  crit:    {name:'Sharp Jaws',base:2500, g:2.2, max:25,      unl:6e3, color:'#f59f00'},
  nest:    {name:'Nest',      base:8000, g:2.0, max:Infinity,unl:4e4, color:'#c68642'},
  feast:   {name:'Feast',     base:5000, g:2.4, max:30,      unl:2e5, color:'#15aabf'}
};
const KEYS=Object.keys(UP);
const GIANT_MULT=5,SING_MULT=10,MILE=25, CRIT_MULT=5, T0=10;
const RJ_BONUS=0.04, RJ_K=2e4, ASC_MIN=5, STAGE_J=3, FOOD_R=1.18, GOALS=[690, 8200, 84000, 910000, 273000000, 81900000000, 24570000000000, 7371000000000000, 2211300000000000000, 663390000000000000000];
const STAGE_FOODS=[10,5,5,5,5,5,5,5,5,5];
const SPACE_FROM=6,ENDLESS_X=12; // Moon onwards
/* skills: id, tier, max levels, base cost, cost growth, prerequisites */
const SKILLS=[
  {id:'queen',  t:1,max:5,c:1,  g:3,   req:[]},
  {id:'hive',   t:1,max:1,c:2,  g:1,   req:[]},
  {id:'acid',   t:1,max:1,c:3,  g:1,   req:[]},
  {id:'headstart',t:2,max:3,c:6,g:6.5, req:['queen']},
  {id:'golden', t:2,max:1,c:10, g:1,   req:['queen']},
  {id:'auto',   t:2,max:1,c:12, g:1,   req:['hive']},
  {id:'soldier',t:2,max:1,c:8,  g:1,   req:['acid']},
  {id:'swarm',  t:3,max:1,c:45, g:1,   req:['hive','soldier']},
  {id:'offline',t:3,max:3,c:25, g:4,   req:['auto']},
  {id:'warp',   t:3,max:1,c:80, g:1,   req:['hive']},
  {id:'meteor', t:3,max:1,c:80, g:1,   req:['acid']},
  {id:'giant',  t:3,max:1,c:120, g:1,   req:['soldier']},
  {id:'decree', t:4,max:3,c:40, g:4,   req:['golden']},
  {id:'veteran',t:4,max:3,c:150,g:5,   req:['headstart']},
  {id:'cosmic', t:4,max:1,c:600,g:1,   req:['warp','meteor']},
  {id:'singularity',t:5,max:1,c:4000,g:1,req:['cosmic','giant','swarm']}
];
const SK={};for(const s of SKILLS)SK[s.id]=s;
const skCost=(id,lv)=>Math.ceil(SK[id].c*Math.pow(SK[id].g,lv));
const HEADSTART=[ {cash:500,workers:5,speed:0,strength:0},{cash:25e3,workers:15,speed:3,strength:8},{cash:5e6,workers:35,speed:10,strength:25} ];
const WARP_DUR=30,WARP_CD=150,WARP_MULT=10,METEOR_CD=120,FRENZY_DUR=15,FRENZY_MULT=3;

let S=null;
const sk=id=>(S.sk&&S.sk[id])||0;
const upMax=k=>k==='workers'?BASE_CAP+(sk('swarm')?150:0):UP[k].max;
const priceMul=()=>Math.pow(STAGE_J,eStage());
const costOne=(k,lv)=>UP[k].base*priceMul()*Math.pow(UP[k].g,lv);
function costN(k,lv,n){const g=UP[k].g;return UP[k].base*priceMul()*Math.pow(g,lv)*(Math.pow(g,n)-1)/(g-1);}
const antTotal=()=>START_ANTS+S.lv.workers;
const speedBase=()=>(1+0.09*S.lv.speed)*(sk('hive')?1.5:1);
/* strength, income and capacity feed one ADDITIVE yield pool (keeps growth polynomial, not runaway) */
const poolStr=()=>.35*S.lv.strength, poolInc=()=>.3*S.lv.income, poolCap=()=>.25*S.lv.capacity;
const yieldPool=()=>1+poolStr()+poolInc()+poolCap();
const skillBite=()=>(sk('acid')?3:1)*(sk('giant')?GIANT_MULT:1)*(sk('soldier')?2:1);
const critChance=()=>Math.min(.5,.02*S.lv.crit);
const critEV=()=>1+critChance()*(CRIT_MULT-1);
const feastFrac=()=>.2+.1*S.lv.feast;
const nestRate=()=>.25*S.lv.nest; // bites per second
function mileCount(){let n=0;for(const k of KEYS)n+=Math.floor(S.lv[k]/MILE);return n;}
const mileMul=()=>Math.pow(2,mileCount());
const presMul=()=>1+RJ_BONUS*S.rjTotal;
const skillMul=()=>(1+.4*sk('queen'))*(sk('singularity')?SING_MULT:1);
const buffMul=()=>S.frenzy>0?FRENZY_MULT:1;
const eStage=()=>S.stage+(S.cycle||0);
/* food value: x STAGE_J per stage, x FOOD_R per food cleared inside the stage (capped at the stage's food count) */
const foodValueAt=(stage,fc)=>2*Math.pow(STAGE_J,stage)*Math.pow(FOOD_R,Math.min(fc,STAGE_FOODS[Math.min(stage,9)]-1));
const curFood=()=>foodValueAt(eStage(),S.fc||0);
const stageGoal=()=>GOALS[Math.min(9,S.stage)]*Math.pow(ENDLESS_X,S.cycle||0)*(S.stage>=SPACE_FROM&&sk('cosmic')?.5:1);
const allMul=()=>yieldPool()*skillBite()*mileMul()*presMul()*skillMul();
const bitePay=fv=>fv*allMul()*buffMul(); // expected pay of one bite (before crit)
const rjGain=re=>Math.floor(Math.pow(Math.max(0,re)/RJ_K,.25)*(1+.25*sk('decree')));
const offlineCap=()=>[6,12,24,48][sk('offline')]*3600;
const offlineRate=()=>[1,1.25,1.5,2][sk('offline')];
function tripTime(sp){return 9.6/sp+0.4/Math.sqrt(sp);}
/* expected income per second at current state (ideal play) */
function estRate(o){
  o=o||{};const fv=o.fv!=null?o.fv:curFood();
  const sp=speedBase(),pr=antTotal()/tripTime(sp);
  const warp=o.warpAvg&&sk('warp')?1+(WARP_MULT-1)*WARP_DUR/(WARP_DUR+WARP_CD):1;
  const pv=bitePay(fv);
  let r=pr*warp*pv*(critEV()+feastFrac())+nestRate()*pv;
  if(o.extra)r*=o.extra;
  return r;
}
function freshRun(S0){
  const hs=sk('headstart'),h=hs?HEADSTART[hs-1]:null;
  S0.money=h?h.cash:0;
  for(const k of KEYS)S0.lv[k]=0;
  if(h){S0.lv.workers=h.workers;S0.lv.speed=h.speed;S0.lv.strength=h.strength;}
  S0.stage=sk('veteran');S0.conq=0;S0.cycle=0;S0.fc=0;S0.fcT=0;S0.runEarned=0;S0.frenzy=0;
}

function drawAntShape(g,f,col){
  col=col||'#14141a';
  g.fillStyle=g.strokeStyle=col;g.lineWidth=1.15;g.lineCap='round';g.lineJoin='round';
  const p=f/4*TAU;
  g.beginPath();
  for(let i=0;i<3;i++)for(const s of[-1,1]){
    const grp=(i+(s>0?0:1))%2,off=Math.sin(p+grp*Math.PI)*2.1;
    const xi=1.8-i*2.4, fx=xi+(1-i)*2.6+off;
    g.moveTo(xi,s*.6);g.lineTo(xi+off*.35+(1-i)*1.2,s*4.2);g.lineTo(fx,s*6.6);
  }
  g.stroke();
  g.lineWidth=.85;g.beginPath();
  for(const s of[-1,1]){g.moveTo(6.2,s*.9);g.lineTo(8.8,s*2.8);g.lineTo(10.8,s*2.5);}
  g.stroke();
  ell(g,-6.4,0,5.3,3.7,0,col);ell(g,-.4,0,3.5,2.5,0,col);ell(g,4.7,0,2.9,2.5,0,col);
  ell(g,-7.6,-1.1,2.2,1,0,col==='#14141a'?'rgba(255,255,255,.14)':'rgba(0,0,0,.12)');
}

/* ============ state ============ */
const SAVE_KEY='tinyColony.v2',OLD_KEY='tinyColony.v1';
function freshState(){
  const lv={};for(const k of KEYS)lv[k]=0;
  return{v:2,money:0,lv,sk:{},rj:0,rjTotal:0,stage:0,conq:0,cycle:0,fc:0,runEarned:0,lifeEarned:0,eaten:0,pieces:0,bulk:1,ts:Date.now(),taps:0,runs:0,
    playTime:0,runTime:0,bestStage:0,won:0,unl:{},warpT:0,warpCd:0,meteorCd:0,frenzy:0,goldenT:60,autoOn:1,sci:0,rate:0,rateOff:0,seen:{},started:Date.now()};
}
const num=(v,d)=>{v=+v;return isFinite(v)?v:(d||0);};
const int0=v=>Math.max(0,Math.floor(num(v)));
function load(){
  const s=freshState();
  try{
    const r=localStorage.getItem(SAVE_KEY);
    if(r){
      const o=JSON.parse(r);
      for(const k of['money','conq','runEarned','lifeEarned','eaten','pieces','rate','rateOff','playTime','runTime','warpT','warpCd','meteorCd','frenzy','goldenT'])s[k]=Math.max(0,num(o[k],s[k]));
      for(const k of KEYS)s.lv[k]=int0(o.lv&&o.lv[k]);
      for(const k of['rj','rjTotal','runs','bestStage','taps','fc','cycle'])s[k]=int0(o[k]);
      s.stage=clamp(int0(o.stage),0,9);s.bulk=[1,10,'max'].includes(o.bulk)?o.bulk:1;s.ts=num(o.ts,Date.now())||Date.now();
      s.won=o.won?1:0;s.autoOn=o.autoOn===0?0:1;s.sci=o.sci?1:0;s.unl=Object.assign({},o.unl||{});s.seen=Object.assign({},o.seen||{});s.started=num(o.started,Date.now());
      for(const sk of SKILLS)s.sk[sk.id]=clamp(int0(o.sk&&o.sk[sk.id]),0,sk.max);
      return s;
    }
    const r1=localStorage.getItem(OLD_KEY);
    if(r1){ /* migrate the v1 save: keep money and upgrades, start the campaign in the Backyard */
      const o=JSON.parse(r1);
      s.money=Math.max(0,num(o.money));s.lv.speed=Math.min(40,int0(o.lv&&o.lv.speed));s.lv.workers=Math.min(BASE_CAP,int0(o.lv&&o.lv.workers));
      s.lv.strength=int0(o.lv&&o.lv.strength);s.lv.income=int0(o.lv&&o.lv.income);
      s.lifeEarned=s.runEarned=Math.max(0,num(o.earned));s.taps=int0(o.taps);s.bulk=[1,10,'max'].includes(o.bulk)?o.bulk:1;s.rate=s.rateOff=Math.max(0,num(o.rate));
      s.ts=num(o.ts,Date.now())||Date.now();s.seen.migrated=1;s.stage=Math.min(3,Math.floor(int0(o.foodIdx)/10));
      return s;
    }
  }catch(e){}
  return s;
}
function save(){S.ts=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}

const cv=$('#c'),ctx=cv.getContext('2d',{alpha:false});

function layout(){
  const r=cv.getBoundingClientRect();const oW=W,oH=H;W=Math.max(200,r.width);H=Math.max(300,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  u=clamp(Math.min(W,H*.62)/390,.85,1.5);AS=.85*u;
  const h1=Math.round(clamp(H*.335,190,310));
  document.documentElement.style.setProperty('--h1',h1+'px');
  hudB=hudEl.getBoundingClientRect().bottom+6;
  document.documentElement.style.setProperty('--h2',Math.round(clamp(H*.66,300,H-hudB-90))+'px');
  chipsEl.style.top=(hudB+2)+'px';
  panelT=H-tabsEl.offsetHeight-h1-4;
  abilEl.style.bottom=(H-panelT+10)+'px';
  const playH=Math.max(200,panelT-hudB);

const stName=()=>S.cycle>0?'Multiverse '+(S.cycle+1):SV[Math.min(S.stage,9)].name;

const kMul=()=>antTotal()/Math.max(1,ants.length||simN());
function spawnFood(eaten,pieces){
  const st=Math.min(S.stage,9),V=SV[st],n=STAGE_FOODS[st],vi=((S.fc%n)+n)%n,def=V.foods[vi];
  if(!pieces){
    const rate=antTotal()*speedBase()/T0;
    pieces=clamp(Math.round(Math.max(10+Math.min(S.fc,30),rate*25)),10,200);
  }
  S.pieces=pieces;
  const vp=Math.max(6,pieces/Math.max(1,kMul()));
  Fd={def,name:def.name,fv:curFood(),sizeF:.72+.28*Math.min(1,vi/Math.max(1,Math.min(n-1,4))),R:0,pieces,claimed:eaten||0,eaten:eaten||0,bites:[],nb:0,vp,state:'spawn',t:0,sc:0,
     seed:(st*131+vi*17+13)|0,base:document.createElement('canvas'),work:document.createElement('canvas'),biteR:clamp(1/Math.sqrt(vp),.06,.24),forced:false};
  Fd.R=baseR*Fd.sizeF;Fd.startAng=Math.random()*TAU;

function makeBite(prog){

function renderFood(){
  const R=Fd.R,size=Math.ceil((R*2+10)*dpr);Fd.size=size;

  Fd.def.draw(g,R,mulberry(Fd.seed));
  Fd.wg=Fd.work.getContext('2d');Fd.wg.drawImage(Fd.base,0,0);

function carve(b){

  const cx=Math.cos(b.a)*b.d*R,cy=Math.sin(b.a)*b.d*R,tx=-Math.sin(b.a),ty=Math.cos(b.a),rr_=b.big||1;

  g.moveTo(cx+tx*r*.95*rr_+r*.5,cy+ty*r*.95*rr_);g.arc(cx+tx*r*.95*rr_,cy+ty*r*.95*rr_,r*.5,0,TAU);
  g.moveTo(cx-tx*r*.95*rr_+r*.5,cy-ty*r*.95*rr_);g.arc(cx-tx*r*.95*rr_,cy-ty*r*.95*rr_,r*.5,0,TAU);

const foodScale=()=>Fd?Fd.sc*(1-.33*Math.pow(clamp(Fd.eaten/Fd.pieces,0,1),1.3)):0;

/* ============ ants ============ */
function addAnt(){
  const a=nest.x+rand(-8,8),b=nest.y+rand(-8,8);
  ants.push({x:a,y:b,ang:rand(0,TAU),tx:a,ty:b,st:0,t:0,ph:rand(0,TAU),leg:rand(0,4),born:0,carry:0,k:1,col:'#fff',bite:null,wt:0});
}
function syncAnts(){const want=simN();while(ants.length<want)addAnt();if(ants.length>want)ants.length=want;}
function claim(a){
  if(!Fd||Fd.state!=='live')return false;
  const left=Fd.pieces-Fd.claimed;if(left<=1e-6)return false;
  const k=Math.min(kMul(),left),prog=Fd.claimed/Fd.pieces;Fd.claimed+=k;
  a.k=k;a.bite=makeBite(prog);a.st=1;a.carry=0;return true;
}
function biteTarget(a){const s=foodScale(),R=Fd.R;a.tx=fx+Math.cos(a.bite.a)*a.bite.d*R*s;a.ty=fy+Math.sin(a.bite.a)*a.bite.d*R*s;}
const warpOn=()=>S.warpT>0;
const speedNow=()=>speedBase()*(warpOn()?WARP_MULT:1);
function updateAnts(dt){
  const sp0=speedNow();
  const base=62*u*sp0;
  const biteT=.4/Math.sqrt(sp0);
  const arrive=7*u;
  for(let i=0;i<ants.length;i++){
    const a=ants[i];a.born=Math.min(1,a.born+dt*4);
    let sp=0;
    if(a.st===0){
      if(claim(a)){} else {
        a.wt-=dt;
        if(a.wt<=0){a.wt=rand(.8,2.2);const wa=rand(0,TAU),wr=rand(14,48)*u;
                    a.tx=nest.x+Math.cos(wa)*wr*1.5;a.ty=nest.y+Math.sin(wa)*wr*1.5;}
        sp=Math.min(base,62*u*3)*.35;
      }
    }
    if(a.st===1){biteTarget(a);sp=base;}
    else if(a.st===3){sp=base*(.92);}
    if(a.st===2){
      a.t-=dt;
      if(a.t<=0){
        const b=a.bite;Fd.bites.push(b);carve(b);Fd.eaten+=a.k;S.eaten=Fd.eaten;
        const R=Fd.R,s=foodScale();const bx=fx+Math.cos(b.a)*b.d*R*s,by=fy+Math.sin(b.a)*b.d*R*s;
        const cr=Fd.def.crumbs;a.col=cr[(Math.random()*3)|0];
        if(!warpOn())for(let k=0;k<3;k++)burst(bx,by,cr[k%3],.5,rand(30,90),rand(1.5,3));
        a.carry=pieceValue()*a.k;a.st=3;a.tx=nest.x+rand(-5,5)*u;a.ty=nest.y+rand(-5,5)*u;
        if(Fd.eaten>=Fd.pieces-1e-6&&Fd.state==='live')finishFood();
      }
    }
    if(sp>0){
      let dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);
      if(d<arrive&&a.st!==0){
        if(a.st===1){a.st=2;a.t=biteT;}
        else if(a.st===3){deliver(a);}
      } else if(d>2){
        let want=Math.atan2(dy,dx);
        if(d>60*u&&a.st!==0)want+=Math.sin(time*3.1+a.ph)*.5*Math.min(1,(d-60*u)/110);
        let diff=want-a.ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
        const mt=(d<45*u?40:10)*dt*(sp0>3?3:1);a.ang+=clamp(diff,-mt,mt);
        const step=Math.min(sp*dt,d);
        a.x+=Math.cos(a.ang)*step;a.y+=Math.sin(a.ang)*step;
        a.leg+=Math.min(step,40)*.075/AS;
        dx=a.tx-a.x;dy=a.ty-a.y;
        if(Math.hypot(dx,dy)<arrive&&a.st!==0){
          if(a.st===1){a.st=2;a.t=biteT;}
          else if(a.st===3){deliver(a);}
        }
      }
    }
  }
}
function deliver(a){
  let v=a.carry,crit=false;
  const cc=critChance();
  if(cc>0){ if(a.k>3){v*=critEV();} else if(Math.random()<cc){v*=CRIT_MULT;crit=true;} }
  gain(v,false,true);
  if(crit)floatText(nest.x+rand(-16,16)*u,nest.y-22*u,'CRIT! +$'+fmt(v),'#f08c00',1.1,1.15);
  else if(floats.length<12)floatText(nest.x+rand(-16,16)*u,nest.y-14*u,'+$'+fmt(v),SV[Math.min(S.stage,9)].dk?'#69db7c':'#12a150',1,.9);
  if(parts.length<120)for(let k=0;k<3;k++)burst(nest.x,nest.y,k%2?'#ffc83d':a.col,.6,rand(40,110),rand(1.5,3));
  nest.pulse=1;a.carry=0;a.st=0;a.wt=0;
}

  if(S.money>1e300)S.money=1e300;if(S.runEarned>1e300)S.runEarned=1e300;if(S.lifeEarned>1e300)S.lifeEarned=1e300;
  if(!bonus){incomeAcc+=v;offAcc+=fromAnt?v/((warpOn()?WARP_MULT:1)*buffMul()):v/buffMul();}
  const now=performance.now();if(now-popT>180){popT=now;$('#moneyPill').animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}],{duration:160});}
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);

  ctx.save();ctx.translate(sx,sy);

    if(s>0.01){
      const R=Fd.R*s;
      ctx.fillStyle=dk?'rgba(0,0,0,.3)':'rgba(30,30,50,.07)';ctx.beginPath();ctx.ellipse(fx+3,fy+R*.1+5,R*.98,R*.94,0,0,TAU);ctx.fill();

      ctx.fillText(Fd.name,fx,ly);

      ctx.fillText(`$${fmt(pieceValue())} per bite`,fx,ly+34*u);
    }
  }
  /* golden crumb */
  if(golden){
    const g=golden,k=Math.min(1,g.life/g.max),pul=1+Math.sin(time*7+g.ph)*.1,r=24*u*pul*Math.min(1,(g.max-g.life)*5+.2);
    ctx.globalAlpha=Math.min(1,g.life*1.5);
    const gr=ctx.createRadialGradient(g.x,g.y,2,g.x,g.y,r*2.2);gr.addColorStop(0,'rgba(255,225,90,.75)');gr.addColorStop(1,'rgba(255,200,40,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,r*2.2,0,TAU);ctx.fill();
    disc(ctx,g.x,g.y,r,'#f59f00');disc(ctx,g.x,g.y,r*.82,'#ffd43b');disc(ctx,g.x-r*.25,g.y-r*.3,r*.28,'rgba(255,255,255,.7)');
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5*u;ctx.lineCap='round';ctx.beginPath();ctx.arc(g.x,g.y,r*1.25,-Math.PI/2,-Math.PI/2+TAU*k);ctx.stroke();
    ctx.globalAlpha=1;
  }
  /* ants */
  const gs=sk('giant')?1.45:1;
  const nCar=1+Math.min(2,Math.floor(S.lv.capacity/12))+(sk('soldier')?0:0);
  const cs=(2.3+Math.min(2.2,S.lv.capacity*.05))*u*Math.sqrt(gs);
  for(let i=0;i<ants.length;i++){
    const a=ants[i],c=Math.cos(a.ang),s=Math.sin(a.ang),sc=(a.born<1?a.born:1)*gs;
    ctx.setTransform(dpr*c*sc,dpr*s*sc,-dpr*s*sc,dpr*c*sc,dpr*(a.x+sx),dpr*(a.y+sy));
    const spr=sprites[(a.leg|0)&3];
    ctx.drawImage(spr,-ANT_W*AS/2,-ANT_H*AS/2,ANT_W*AS,ANT_H*AS);

        ctx.fillStyle=q?Fd&&Fd.def.crumbs[(q+1)%3]||a.col:a.col;ctx.beginPath();ctx.arc(ox,oy,cs*(1-q*.12),0,TAU);ctx.fill();}
      ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(10*AS,-cs*.3,cs*.35,0,TAU);ctx.fill();}
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.translate(sx,sy);
  /* meteors */
  for(const m of meteors){const k=Math.min(1,m.t/.55),x=m.x+(m.tx-m.x)*k,y=m.y+(m.ty-m.y)*k,tx=m.x+(m.tx-m.x)*Math.max(0,k-.25),ty=m.y+(m.ty-m.y)*Math.max(0,k-.25);
    const gr=ctx.createLinearGradient(tx,ty,x,y);gr.addColorStop(0,'rgba(255,140,40,0)');gr.addColorStop(1,'rgba(255,200,80,.95)');ctx.strokeStyle=gr;ctx.lineWidth=14*u;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(x,y);ctx.stroke();
    disc(ctx,x,y,13*u,'#ff922b');disc(ctx,x,y,8*u,'#fff3bf');}
  for(let i=0;i<parts.length;i++){const p=parts[i];ctx.globalAlpha=Math.min(1,p.l/p.m*1.6);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*u,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  for(let i=0;i<floats.length;i++){const f=floats[i],k=f.l/f.m;

  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=Math.min(.55,flash*.7);ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}

for(const k of KEYS){

  b.innerHTML=`<div class="r1"><i class="ic" style="background:${UP[k].color}">${ICON[k]}</i><span class="nm">${UP[k].name}<b></b></span><span class="lv"></span></div><div class="r2"><span class="fx"></span><span class="cost"></span></div><div class="ms"><i></i></div>`;

  b.addEventListener('click',e=>{e.preventDefault();buy(k);});
}
function quote(k){
  const lv=S.lv[k],cap=upMax(k)-lv;
  if(cap<=0)return{n:0,cost:0,maxed:true};
  let n;
  if(S.bulk===1)n=1;
  else if(S.bulk===10)n=Math.min(10,cap);
  else{n=0;let spent=0;while(n<cap&&n<1000){const c=costOne(k,lv+n);if(spent+c>S.money)break;spent+=c;n++;}if(n===0)n=1;}
  const cost=costN(k,lv,n);
  return{n,cost:isFinite(cost)?cost:Infinity,maxed:false};
}
function refreshButtons(){
  for(const k of KEYS){
    const B=btns[k];
    if(!S.unl[k]){if(B.shown){B.shown=false;B.el.classList.add('hide');}continue;}
    if(!B.shown){B.shown=true;B.el.classList.remove('hide');B.el.classList.add('newu');setTimeout(()=>B.el.classList.remove('newu'),600);}
    const q=quote(k),lv=S.lv[k];
    const off=q.maxed||q.cost>S.money;
    const txt=q.maxed?'MAX':(q.n>1?`x${q.n} `:'')+'$'+fmt(q.cost);
    const sig=lv+'|'+txt+'|'+off+'|'+effectText(k)+'|'+upMax(k);
    B.el.classList.toggle('maxed',q.maxed);
    if(sig!==B.last){B.last=sig;
      const mx=upMax(k),ms=Math.floor(lv/MILE);
      B.lv.textContent=isFinite(mx)?`Lv ${lv}/${mx}`:'Lv '+lv;B.fx.textContent=effectText(k);B.cost.textContent=txt;
      B.star.textContent=ms>0?'★'+ms:'';B.ms.style.width=((lv%MILE)/MILE*100)+'%';B.el.title=`Next x2 income at level ${(ms+1)*MILE}`;}
    if(B.off!==off){B.off=off;B.el.classList.toggle('off',off);}
  }
  const bl='Buy '+(S.bulk==='max'?'MAX':'x'+S.bulk);if($('#bulk').textContent!==bl)$('#bulk').textContent=bl;
}
function checkUnlocks(silent){
  for(const k of KEYS){if(!S.unl[k]&&S.runEarned>=UP[k].unl){S.unl[k]=1;if(!silent&&k!=='speed')toast('New upgrade: '+UP[k].name,'Check the Upgrades tab');}}
}
function applyBuy(k,n,cost){
  const old=Math.floor(S.lv[k]/MILE);
  S.money-=cost;S.lv[k]+=n;
  if(k==='workers')syncAnts();
  const nw=Math.floor(S.lv[k]/MILE);
  return nw>old;
}
function buy(k){
  const q=quote(k),B=btns[k];
  if(q.maxed||q.cost>S.money){
    B.el.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:220});
    return false;
  }
  const mile=applyBuy(k,q.n,q.cost);
  B.el.animate([{transform:'scale(.92)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
  const r=B.el.getBoundingClientRect(),cr=cv.getBoundingClientRect();
  for(let i=0;i<14;i++)burst(r.left+r.width*rand(.2,.8)-cr.left,r.top-cr.top+6,UP[k].color,.7,rand(80,200),rand(2,4));
  floatText(r.left+r.width/2-cr.left,r.top-cr.top-14,k==='workers'?'+'+q.n+' ant'+(q.n>1?'s':''):'Level up!',UP[k].color,1.1,1.1);
  if(mile){toast(UP[k].name+' milestone!','Income x2 (total milestone bonus x'+fmt(mileMul())+')');for(let i=0;i<30;i++)burst(r.left+r.width/2-cr.left,r.top-cr.top,'#ffd43b',1,rand(80,240),rand(2,4));}
  save();refreshButtons();updateHud(true);
  return true;
}
$('#bulk').addEventListener('click',()=>{S.bulk=S.bulk===1?10:S.bulk===10?'max':1;refreshButtons();$('#bulk').animate([{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:140});save();});
function autoBuy(){
  for(let n=0;n<3;n++){
    let best=null,bc=Infinity;
    for(const k of KEYS){if(!S.unl[k]||S.lv[k]>=upMax(k))continue;const c=costOne(k,S.lv[k]);if(c<=S.money&&c<bc){bc=c;best=k;}}
    if(!best)return;
    const mile=applyBuy(best,1,bc);

  }

}

/* ============ main loop ============ */
let last=performance.now(),acc1=0,acc2=0,acc3=0,accA=0,accN=0,fps=60;
function step(dt){
  time+=dt;
  S.playTime+=dt;S.runTime+=dt;
  if(S.warpT>0){S.warpT-=dt;if(S.warpT<=0){S.warpT=0;S.warpCd=WARP_CD;}}else if(S.warpCd>0)S.warpCd=Math.max(0,S.warpCd-dt);
  if(S.meteorCd>0)S.meteorCd=Math.max(0,S.meteorCd-dt);
  if(S.frenzy>0)S.frenzy=Math.max(0,S.frenzy-dt);
  if(bgT<1){bgT=Math.min(1,bgT+dt/1.1);if(bgT>=1)bgPrev=null;}
  if(Fd){
    Fd.t+=dt;
    if(Fd.state==='spawn'){const k=Math.min(1,Fd.t/.55),c1=1.70158,c3=c1+1;Fd.sc=Math.max(0,1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2));if(Fd.t>.35)Fd.state='live';if(k>=1)Fd.sc=1;}
    else if(Fd.state==='dying'){Fd.sc=Math.max(0,1-Fd.t/.4);if(Fd.t>.75)nextFood();}
  }
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.t+=dt;if(m.t>=.55){meteors.splice(i,1);meteorImpact(m);}}
  if(sk('golden')){
    if(golden){golden.life-=dt;if(golden.life<=0)golden=null;}
    else{S.goldenT-=dt;if(S.goldenT<=0&&Fd&&Fd.state==='live'){spawnGolden();S.goldenT=rand(50,95);}}
  }
  if(S.lv.nest>0&&Fd){
    const v=nestRate()*pieceValue()*dt;gain(v,false,false);accN+=dt;
    if(accN>2.5){accN=0;floatText(nest.x,nest.y+nest.r*1.8,'+$'+fmt(nestRate()*pieceValue()*2.5),'#c68642',1,.85);}
  }
  updateAnts(dt);updateFx(dt);
  if(S.conq>=stageGoal())checkConquest();
  acc1+=dt;if(acc1>=1){acc1-=1;S.rate=S.rate>0?S.rate*.9+incomeAcc*.1:incomeAcc;S.rateOff=S.rateOff>0?S.rateOff*.9+offAcc*.1:offAcc;incomeAcc=0;offAcc=0;checkUnlocks(false);}
  if(sk('auto')&&S.autoOn){accA+=dt;if(accA>=.9){accA=0;autoBuy();}}
}
function frame(t){
  let dt=(t-last)/1000;last=t;if(!(dt>0))dt=.016;dt=Math.min(dt,.05);
  step(dt);render();
  acc2+=dt;if(acc2>=.12){acc2=0;refreshButtons();updateHud(false);updateAbilities();
    if(tab===1)renderSkills(false);else if(tab===2)renderConq(false);else if(tab===3)renderSettings(false);}
  acc3+=dt;if(acc3>=5){acc3=0;save();}
  requestAnimationFrame(frame);
}

    get golden(){return golden;},get gain(){return ascendGain();},get tab(){return tab;},
    give(v){gain(v,true);S.money=S.money;},setMoney(v){S.money=v;},
    setStage(n,f){S.stage=n;S.cycle=0;S.conq=(f||0)*stageGoal();S.fc=0;stageChanged();refreshButtons();updateHud(true);},
    setRun(v){S.runEarned=v;checkUnlocks(true);updateHud(true);},
    addRJ(n){S.rj+=n;S.rjTotal+=n;skSig='';updateHud(true);},
    fmt,stageGoal,pieceValue,estRate,mileMul,presMul,
    simBot(sec,o){o=o||{};const dt=.05,log=[];let t=0,botT=0,tt0=S.playTime;
      const order=['queen','hive','acid','queen','headstart','soldier','auto','golden','queen','warp','headstart','meteor','swarm','offline','giant','decree','queen','veteran','cosmic','decree','headstart','offline','singularity','veteran','decree','offline','veteran'];
      const pol=o.policy==null?.7:o.policy;
      const rate=()=>estRate({extra:1});
      function buyAll(){
        for(let g=0;g<400;g++){
          let best=null;const base=rate();
          for(const k of KEYS){if(!S.unl[k]||S.lv[k]>=upMax(k))continue;const c=costOne(k,S.lv[k]);S.lv[k]++;const r2=rate();S.lv[k]--;const ratio=(r2-base)/c;if(!best||ratio>best.ratio)best={k,ratio,c};}
          if(!best)return;
          if(best.c<=S.money){applyBuy(best.k,1,best.c);continue;}
          let alt=null;for(const k of KEYS){if(!S.unl[k]||S.lv[k]>=upMax(k))continue;const c=costOne(k,S.lv[k]);if(c>S.money)continue;S.lv[k]++;const r2=rate();S.lv[k]--;const ratio=(r2-base)/c;if(ratio>=best.ratio*.5&&(!alt||ratio>alt.ratio))alt={k,ratio,c};}
          if(alt){applyBuy(alt.k,1,alt.c);continue;}
          return;
        }
      }
      function skills(){for(let g=0;g<20;g++){let did=false;for(const id of order){const l=sk(id);if(l>=SK[id].max)continue;if(!skillReqOk(id))continue;if(skCost(id,l)<=S.rj){S.rj-=skCost(id,l);S.sk[id]=l+1;did=true;}break;}if(!did)return;}}
      let stg=S.stage,stT=S.runTime;
      while(t<sec){
        step(dt);t+=dt;botT+=dt;
        if(S.stage!==stg){log.push({ev:'stage',from:stg,to:S.stage,run:S.runs,at:+(S.playTime/60).toFixed(1)});stg=S.stage;}
        if(botT>=1){botT=0;
          if(!modal.hidden)hideModal();
          if(golden)tapGolden();
          if(sk('warp')&&!S.warpT&&!S.warpCd)useWarp();
          if(sk('meteor')&&!S.meteorCd)useMeteor();
          buyAll();
          const g=ascendGain();
          if(!o.noAscend&&g>=ASC_MIN&&g>=Math.max(ASC_MIN,S.rjTotal*pol)){log.push({ev:'ascend',n:S.runs+1,gain:g,run:+(S.runTime/60).toFixed(1),at:+(S.playTime/60).toFixed(1),stage:S.stage});doAscend();stg=S.stage;skills();}
          if(S.won&&!log.some(l=>l.ev==='won')){log.push({ev:'won',at:+(S.playTime/60).toFixed(1),runs:S.runs});if(o.stopOnWin)break;}
          if(o.stopOnAscendable&&canAscend()){log.push({ev:'ascendable',at:+(S.playTime/60).toFixed(1),stage:S.stage,gain:g});break;}
        }
      }
      return log;},

    foodsSheet(){const cols=10,cell=96;const rows=SV.length;const c=document.createElement('canvas');c.width=cols*cell;c.height=rows*cell;const g=c.getContext('2d');
      SV.forEach((V,r)=>{g.fillStyle=V.bg;g.fillRect(0,r*cell,cols*cell,cell);V.foods.forEach((f,i)=>{g.save();g.translate(i*cell+cell/2,r*cell+cell/2);f.draw(g,40,mulberry(i*7+r));g.restore();});});return c.toDataURL('image/png');}};
}
})();
</script>
