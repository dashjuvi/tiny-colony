<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Colony</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiny Colony">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Tiny Colony 3.0 - a free, ad-free idle ant game. Evolve from ants to cosmic beings, run roguelike Expeditions and race speedruns. No tracking, no purchases.">
<link rel="icon" id="favicon" href="data:,">
<link rel="apple-touch-icon" id="touchicon" href="">
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--h1:290px;--h2:520px;--acc:#51cf66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none;touch-action:manipulation;
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;color:#fff}
body{position:fixed;inset:0;width:100%}
button{font-family:inherit}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px);pointer-events:none}
#row1{display:flex;gap:8px;align-items:flex-start}
.pill{background:rgba(22,24,30,.84);color:#fff;border-radius:999px;padding:7px 13px 7px 10px;font-weight:800;font-size:17px;line-height:24px;
  display:flex;align-items:center;gap:6px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.16);
  border:0;white-space:nowrap}
.pill svg{width:21px;height:21px;flex:none}
#col{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
#rate{font-size:12px;font-weight:800;color:#7a8190;padding-left:12px;height:15px;text-shadow:0 0 4px rgba(255,255,255,.7)}
body.dk #rate{color:#9aa3bd;text-shadow:none}
#rjPill{margin-left:auto;pointer-events:auto;cursor:pointer;transition:box-shadow .3s}
#rjPill:active{transform:scale(.95)}
#rjPill.glow{box-shadow:0 0 0 2px #ffd43b,0 0 18px rgba(255,212,59,.75);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px #ffd43b,0 0 6px rgba(255,212,59,.4)}}
#stage{position:relative;height:28px;margin-top:2px;border-radius:999px;background:rgba(22,24,30,.84);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#stageFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc);border-radius:999px;transition:width .25s linear,background .6s}
#stageTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
#stageTxt i{font-style:normal;opacity:.9}
#chips{position:absolute;left:calc(var(--sl) + 12px);top:100px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;z-index:3;pointer-events:none}
.chip{background:rgba(22,24,30,.84);color:#fff;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.16);border:0;white-space:nowrap}
.chip.gold{background:#ffd43b;color:#3a2e00;pointer-events:auto;cursor:pointer;animation:glow2 1.4s ease-in-out infinite}
@keyframes glow2{50%{transform:scale(1.05)}}
.chip.warp{background:#4dabf7;color:#06243d}
.chip.fren{background:#ff922b;color:#3d1d00}
#abil{position:absolute;right:calc(var(--sr) + 12px);bottom:300px;display:flex;flex-direction:column;gap:10px;z-index:4}
.ab{position:relative;width:58px;height:58px;border-radius:50%;border:0;padding:0;background:rgba(22,24,30,.9);color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:transform .08s}
.ab:active{transform:scale(.92)}
.ab svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ab svg.ring circle{fill:none;stroke-width:4}
.ab .rb{stroke:rgba(255,255,255,.14)}
.ab .rf{stroke:#3ddc84;stroke-linecap:round;transition:stroke-dashoffset .15s linear}
.ab.cd .rf{stroke:#8a91a1}
.ab.act .rf{stroke:#ffd43b}
.ab .ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ab .ico svg{width:26px;height:26px}
.ab .tm{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-weight:900;font-size:11px;text-shadow:0 1px 2px #000}
.ab.ready{animation:glow2 1.8s ease-in-out infinite}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:5}
#content{position:relative;height:var(--h1);transition:height .25s ease;overflow:hidden}
#panel.tall #content{height:var(--h2);background:#f4f5f9;border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.2);color:#1b1e26}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 calc(var(--sr) + 10px) 10px calc(var(--sl) + 10px);display:none;overscroll-behavior:contain;touch-action:pan-y}
.page.on{display:block}
#panel.tall .page{padding-top:14px}
#pin{max-width:560px;margin:0 auto}
#bulkrow{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px;gap:8px}
#hint{color:#9aa1ad;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dk #hint{color:#9aa3bd}
#bulk{background:rgba(22,24,30,.84);color:#fff;border:0;border-radius:999px;padding:6px 14px;font:800 13px/16px inherit;font-family:inherit;cursor:pointer;flex:none}
#bulk:active{transform:scale(.94)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.up{position:relative;overflow:hidden;background:rgba(22,24,30,.92);color:#fff;border:0;border-radius:18px;padding:9px 11px 12px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:7px;min-height:66px;box-shadow:0 3px 10px rgba(0,0,0,.18);transition:opacity .15s,transform .08s}
.up:active{transform:scale(.96)}
.up.off{opacity:.58}
.up.hide{display:none}
.up.newu{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.r1,.r2{display:flex;align-items:center;gap:7px;width:100%}
.ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:16px;height:16px}
.nm{font-weight:800;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{color:#ffd43b;font-size:11px;margin-left:4px}
.lv{font-size:12px;font-weight:700;color:#aab1bf;white-space:nowrap}
.r2{justify-content:space-between}
.fx{font-size:12px;font-weight:700;color:#aab1bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost{font-weight:800;font-size:14px;border-radius:999px;padding:3px 10px;background:#3ddc84;color:#06240f;white-space:nowrap}
.off .cost{background:#454a57;color:#c3c8d3}
.maxed .cost{background:#ffd43b;color:#3a2e00}
.ms{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1)}
.ms i{display:block;height:100%;width:0;background:#ffd43b;border-radius:0 3px 3px 0}
#tabs{display:flex;gap:2px;padding:6px calc(var(--sr) + 8px) calc(var(--sb) + 6px) calc(var(--sl) + 8px);background:rgba(22,24,30,.96)}
.tab{position:relative;flex:1;border:0;background:none;color:#8a91a1;font:800 11px/1 inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 6px;border-radius:14px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab.on{color:#fff;background:rgba(255,255,255,.1)}
.tab .dot{position:absolute;top:3px;left:calc(50% + 6px);width:10px;height:10px;border-radius:50%;background:#ff5d5d;border:2px solid #16181e;display:none}
.tab .dot.on{display:block}
/* sheets */
.sh{max-width:560px;margin:0 auto}
.sh h3{margin:14px 4px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7b8294;font-weight:900}
.sh h3:first-child{margin-top:0}
.box{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 1px 4px rgba(20,25,40,.08);margin-bottom:8px}
.rjhead{display:flex;align-items:center;gap:12px}
.rjhead .big{font-size:30px;font-weight:900;line-height:1;color:#b4237a}
.rjhead small{display:block;font-size:12px;font-weight:700;color:#6b7385;margin-top:3px}
.sk{display:flex;gap:11px;align-items:center;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(20,25,40,.08);cursor:pointer;border:2px solid transparent;transition:transform .08s}
.sk:active{transform:scale(.98)}
.sk .ic{width:42px;height:42px}
.sk .ic svg{width:23px;height:23px}
.sk .bd{flex:1;min-width:0}
.sk .tt{font-weight:900;font-size:15px;display:flex;gap:6px;align-items:center}
.sk .tt em{font-style:normal;font-size:11px;font-weight:800;color:#7b8294;background:#eef0f4;border-radius:999px;padding:1px 7px}
.sk .ds{font-size:12.5px;line-height:1.3;color:#566;font-weight:600;margin-top:2px}
.sk .rq{font-size:11.5px;font-weight:800;color:#d9480f;margin-top:3px}
.sk .go{flex:none;font-weight:900;font-size:14px;border-radius:999px;padding:6px 11px;background:#ffd6ec;color:#8a1857;white-space:nowrap}
.sk.can{border-color:#ff9ed2}
.sk.can .go{background:#e64a9e;color:#fff}
.sk.lock{opacity:.5}
.sk.own{background:#fff7e0}
.sk.own .go{background:#ffd43b;color:#3a2e00}
.sk.act .tt::after{content:"ACTIVE";font-size:9.5px;font-weight:900;letter-spacing:.06em;background:#4dabf7;color:#fff;border-radius:6px;padding:2px 5px}
.stg{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border-radius:16px;margin-bottom:6px;box-shadow:0 1px 4px rgba(20,25,40,.08)}
.stg .dotc{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff}
.stg .bd{flex:1;min-width:0}
.stg .nn{font-weight:900;font-size:15px}
.stg .ss{font-size:12px;font-weight:700;color:#6b7385;margin-top:1px}
.stg.cur{box-shadow:0 0 0 2px var(--acc),0 2px 8px rgba(20,25,40,.12)}
.stg.lk{opacity:.5}
.pbar{height:7px;border-radius:4px;background:#e6e9f0;margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:4px;width:0}
.ascbtn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:900 16px/1 inherit;font-family:inherit;margin-top:10px;cursor:pointer;background:linear-gradient(135deg,#ff6bb5,#ffb347);color:#fff;box-shadow:0 4px 14px rgba(230,74,158,.35)}
.ascbtn:active{transform:scale(.98)}
.ascbtn[disabled]{background:#d8dce6;color:#8a91a1;box-shadow:none;cursor:default}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;font-weight:700;border-bottom:1px solid #eef0f4}
.row:last-child{border:0}
.row span:last-child{color:#566;font-weight:800;text-align:right}
.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-weight:800;font-size:14px;border-bottom:1px solid #eef0f4}
.tg{width:48px;height:28px;border-radius:14px;background:#cfd3dc;border:0;position:relative;cursor:pointer;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on{background:#3ddc84}.tg.on::after{transform:translateX(20px)}
.note{font-size:12.5px;line-height:1.45;color:#6b7385;font-weight:600;margin:6px 4px}
#toast{position:absolute;left:50%;top:150px;transform:translate(-50%,-20px);opacity:0;z-index:12;pointer-events:none;background:rgba(22,24,30,.94);color:#fff;border-radius:16px;padding:10px 16px;font-weight:800;font-size:14px;text-align:center;max-width:86%;box-shadow:0 6px 20px rgba(0,0,0,.28);transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-weight:700;font-size:12px;color:#c3c8d3;margin-top:2px}
#modal{position:absolute;inset:0;background:rgba(10,12,18,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal[hidden]{display:none}
.card{background:#fff;color:#1b1e26;border-radius:24px;padding:22px 22px 18px;width:100%;max-width:350px;max-height:92%;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.3);text-align:center;animation:cardin .25s ease-out}
@keyframes cardin{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 6px;font-size:22px}
.card p{margin:6px 0 12px;font-size:14px;line-height:1.4;color:#566}
.card .big{font-size:34px;font-weight:900;color:#12a150;margin:4px 0 2px}
.card .big.pk{color:#c2287f}
.card .stats{text-align:left;background:#f4f5f9;border-radius:14px;padding:6px 14px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font:800 16px/1 inherit;font-family:inherit;margin-top:8px;cursor:pointer;background:#1b1e26;color:#fff}
.btn:active{transform:scale(.97)}
.btn.good{background:#3ddc84;color:#06240f}
.btn.pink{background:linear-gradient(135deg,#ff6bb5,#ffb347);color:#fff}
.btn.ghost{background:#eef0f4;color:#1b1e26}
.btn.danger{background:#ff5d5d;color:#fff}

/* ===== v3 additions ===== */
#abilL{position:absolute;left:calc(var(--sl) + 12px);bottom:300px;display:flex;flex-direction:column;gap:10px;z-index:4}
.ab.wp{width:54px;height:54px}
.ab.wp .ico svg{width:24px;height:24px}
.ab.empty{display:none}
#srbar{display:none;align-items:center;gap:8px;margin-top:5px;height:26px;border-radius:999px;background:rgba(22,24,30,.88);padding:0 12px;font-weight:800;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.16);font-variant-numeric:tabular-nums}
#srbar .srt{font-size:15px;color:#ffd43b}
#srbar .srn{flex:1;opacity:.85;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#srbar b{font-weight:900}
.gn{color:#3ddc84}.rd{color:#ff6b6b}.gold{color:#ffd43b}.mu{color:#8a91a1}
#pherbar{height:5px;margin-top:5px;border-radius:3px;background:rgba(22,24,30,.35);overflow:hidden;display:none}
#pherbar.on{display:block}
#pherFill{display:block;height:100%;width:0;background:#4dabf7;border-radius:3px;transition:width .15s}
#pherFill.rush{background:#ffd43b;box-shadow:0 0 8px #ffd43b}
.chip.rush{background:#ffd43b;color:#3a2e00}
.chip.rain{background:#74c0fc;color:#06243d}
.tab .dot{top:2px}
.tab span{font-size:10.5px}
/* segmented */
.seg{display:flex;gap:4px;background:#e4e7ee;border-radius:14px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 0;font:800 13px/1 inherit;font-family:inherit;color:#566;cursor:pointer;position:relative}
.seg button.on{background:#fff;color:#1b1e26;box-shadow:0 1px 4px rgba(20,25,40,.15)}
.dot2{position:absolute;top:3px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff5d5d}
/* archetype */
.archg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arch{border:2px solid transparent;background:#fff;border-radius:16px;padding:9px 10px;text-align:left;cursor:pointer;color:#1b1e26;font-family:inherit;box-shadow:0 1px 4px rgba(20,25,40,.08);display:flex;flex-direction:column;gap:3px}
.arch b{font-size:15px;color:var(--c)}
.arch span{font-size:11.5px;font-weight:700;color:#566;line-height:1.3}
.arch.on{border-color:var(--c);background:#fff}
.arch .sp{display:flex;gap:2px;margin-top:3px;align-items:center;flex-wrap:wrap}
.archg.small{grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}
.archg.small .arch{padding:8px 4px;text-align:center}
.archg.small .arch b{font-size:12.5px}
.sk.tier .ic.sp{background:#e8f7f1;border-radius:12px;width:54px;height:42px;overflow:hidden}
.sk.tier .ic.sp img{max-width:50px;max-height:36px}
.sk .go.dna{background:#c3fae8;color:#087f5b}
.sk .go.ess{background:#f3d9fa;color:#862e9c}
.sk.own .go.dna,.sk.own .go.ess{background:#ffd43b;color:#3a2e00}
.sk.can .go.dna{background:#12b886;color:#fff}
.sk.can .go.ess{background:#ae3ec9;color:#fff}
.sk.can.gcan{border-color:#63e6be}.sk.can.ccan{border-color:#e599f7}
.ascbtn.evb{background:linear-gradient(135deg,#12b886,#74c0fc);box-shadow:0 4px 14px rgba(18,184,134,.35)}
.ascbtn.trb{background:linear-gradient(135deg,#ae3ec9,#4c6ef5);box-shadow:0 4px 14px rgba(174,62,201,.35)}
/* arsenal */
.slots{display:flex;gap:8px;margin-top:8px}
.slot{flex:1;height:58px;border-radius:14px;background:#eef0f4;border:2px dashed #cfd3dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:800;color:#8a91a1}
.slot svg{width:24px;height:24px}
.slot em{font-style:normal;font-size:10.5px;color:#566}
.slot.lk{opacity:.5}
.sk.wpn{align-items:flex-start}
.sk.wpn .ic{margin-top:3px}
.sk.wpn .ic svg{width:21px;height:21px}
.btnc{display:flex;flex-direction:column;gap:5px;flex:none;align-items:stretch}
.btnc .go{border:0;font-family:inherit;cursor:pointer;background:#eef0f4;color:#566}
.btnc .go.buy{background:#12b886;color:#fff}
.btnc .go.eq{background:#ffd43b;color:#3a2e00}
.btnc .mx{font-weight:900;font-size:12px;color:#c58b00;text-align:center}
/* more menu */
.sh2{display:flex;flex-direction:column;gap:8px}
.mcard{display:flex;align-items:center;gap:12px;background:#fff;border:0;border-radius:18px;padding:12px 14px;box-shadow:0 1px 4px rgba(20,25,40,.08);cursor:pointer;color:#1b1e26;font-family:inherit;text-align:left;position:relative}
.mcard:active{transform:scale(.98)}
.mi{font-size:26px;width:36px;text-align:center}
.mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mt b{font-size:15.5px}.mt small{font-size:12px;font-weight:700;color:#6b7385}
.chev{font-size:24px;color:#aab1bf;font-weight:900}
.badge{position:absolute;top:9px;right:34px;background:#ff5d5d;color:#fff;border-radius:999px;font-style:normal;font-size:11px;font-weight:900;padding:2px 7px;min-width:20px;text-align:center}
.backb{border:0;background:none;color:#4c6ef5;font:900 15px/1 inherit;font-family:inherit;padding:2px 4px 10px;cursor:pointer}
/* leaderboard */
.lbrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 4px rgba(20,25,40,.08);cursor:pointer}
.lbrow.first{background:#fff8e1}
.lbrow .rk{width:26px;height:26px;border-radius:50%;background:#1b1e26;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.lbrow.first .rk{background:#f59f00}
.lbrow .nm{flex:1;min-width:0;font-weight:900;font-size:15px;display:flex;flex-direction:column;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow .nm small{font-size:11px;color:#7b8294;font-weight:700}
.lbrow .tm{font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.lbd{margin-top:-2px}
.spt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:700}
.spt th{text-align:left;font-size:10.5px;color:#7b8294;letter-spacing:.06em;text-transform:uppercase;padding:3px 4px}
.spt th:not(:first-child),.spt td:not(:first-child){text-align:right}
.spt td{padding:4px 4px;border-top:1px solid #eef0f4}
.spt tr.cur td{background:#fff3bf}

    g.fillStyle='#fff';g.beginPath();g.moveTo(cx,cy-h);g.lineTo(cx+w*.34,cy-h*.35);g.lineTo(cx+w*.1,cy-h*.5);g.lineTo(cx-w*.1,cy-h*.3);g.lineTo(cx-w*.34,cy-h*.35);g.closePath();g.fill();}}
/* earth */
function drawIsland(g,R,rnd){disc(g,0,0,R,'#1f86d4');disc(g,0,0,R*.94,'#3da9ee');disc(g,0,0,R*.78,'#6cc6f5');wavy(g,R*.5,R*.06,6,'#f2dc9b',.3);wavy(g,R*.4,R*.05,6,'#5cb85e',1);
  g.strokeStyle='#3b8a47';g.lineWidth=R*.04;g.lineCap='round';for(let i=0;i<6;i++){const a=i/6*TAU+.3;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(Math.cos(a)*R*.12,Math.sin(a)*R*.12-R*.05,Math.cos(a)*R*.24,Math.sin(a)*R*.24);g.stroke();}disc(g,0,0,R*.04,'#7a4b2a');
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=R*.025;for(let i=0;i<6;i++){const a=i*1.1;g.beginPath();g.arc(0,0,R*(.62+(i%3)*.1),a,a+.5);g.stroke();}}
function drawHurricane(g,R,rnd){sph(g,R,'#5aa4ea','#2f78c8','#1e56a0');g.save();clipDisc(g,R*.97);g.lineCap='round';for(let arm=0;arm<3;arm++){g.strokeStyle='rgba(255,255,255,.82)';g.lineWidth=R*.14;g.beginPath();for(let i=0;i<=40;i++){const t=i/40,a=arm*TAU/3+t*4.2,r=R*(.14+t*.8);const x=Math.cos(a)*r,y=Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
  g.restore();disc(g,0,0,R*.1,'#2f78c8');gloss(g,R,.85);}
function drawIceCap(g,R,rnd){disc(g,0,0,R,'#8ec5ee');disc(g,0,0,R*.94,'#c9e6fb');wavy(g,R*.74,R*.07,8,'#f4fbff',.4);wavy(g,R*.5,R*.05,6,'#fff',1.4);
  g.strokeStyle='rgba(120,170,215,.55)';g.lineWidth=R*.025;g.lineCap='round';for(let i=0;i<6;i++){const a=i/6*TAU+.2;g.beginPath();g.moveTo(Math.cos(a)*R*.1,Math.sin(a)*R*.1);g.lineTo(Math.cos(a+.1)*R*.7,Math.sin(a+.1)*R*.7);g.stroke();}}
function drawDeep(g,R,rnd){sph(g,R,'#3b8be0','#1c58b8','#0f2f78');g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=R*.03;g.lineCap='round';for(let j=0;j<6;j++){g.beginPath();for(let i=0;i<=24;i++){const x=-R*.7+i*R*.058,y=-R*.55+j*R*.22+Math.sin(i*.7+j*2)*R*.05;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}gloss(g,R,.85);}
function drawEarth(g,R,rnd){disc(g,0,0,R,'rgba(130,200,255,.5)');sph(g,R*.94,'#6cc0ff','#2b7fe0','#154a9c');g.save();clipDisc(g,R*.94);
  g.save();g.translate(-R*.25,-R*.1);wavy(g,R*.34,R*.08,5,'#4cae5a',.5);wavy(g,R*.22,R*.05,5,'#7cc86a',2);g.restore();g.save();g.translate(R*.4,R*.3);wavy(g,R*.28,R*.07,5,'#4cae5a',1.3);g.restore();g.save();g.translate(R*.3,-R*.45);wavy(g,R*.18,R*.05,4,'#4cae5a',.1);g.restore();
  g.fillStyle='rgba(255,255,255,.75)';for(const [x,y,w] of[[-.4,.35,.3],[.1,-.2,.25],[.45,.0,.2],[-.1,.6,.2]]){g.beginPath();g.ellipse(R*x,R*y,R*w,R*w*.3,.4,0,TAU);g.fill();}
  const sh=g.createRadialGradient(-R*.3,-R*.3,R*.3,0,0,R);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,10,40,.45)');disc(g,0,0,R,sh);g.restore();gloss(g,R,.8);}
/* moon */
function drawRock(g,R,rnd){disc(g,0,0,R,'#3a3f52');wavy(g,R*.9,R*.08,7,'#7d8396',.4);wavy(g,R*.78,R*.07,7,'#9aa1b4',.8);g.fillStyle='#b6bccc';g.beginPath();g.moveTo(-R*.4,-R*.3);g.lineTo(R*.1,-R*.5);g.lineTo(R*.3,-R*.1);g.lineTo(-R*.1,R*.1);g.closePath();g.fill();
  g.fillStyle='#6a7186';g.beginPath();g.moveTo(-R*.1,R*.1);g.lineTo(R*.3,-R*.1);g.lineTo(R*.45,R*.35);g.lineTo(0,R*.5);g.closePath();g.fill();for(let i=0;i<5;i++){const a=rnd()*TAU,r=R*rnd()*.6;disc(g,Math.cos(a)*r,Math.sin(a)*r,R*.05,'rgba(40,45,60,.5)');}}
function drawCrater(g,R,rnd){disc(g,0,0,R,'#7f8699');disc(g,0,0,R*.94,'#a9afbf');disc(g,0,0,R*.7,'#8a91a4');disc(g,R*.06,R*.06,R*.58,'#6d7488');disc(g,-R*.02,-R*.02,R*.55,'#7c8397');
  g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=R*.05;g.beginPath();g.arc(0,0,R*.7,3.4,4.8);g.stroke();for(const [x,y,s] of[[-.62,.3,.12],[.58,-.35,.1],[.5,.5,.08]]){disc(g,R*x,R*y,R*s,'#8a91a4');disc(g,R*x+R*s*.2,R*y+R*s*.2,R*s*.8,'#6d7488');}}
function drawSat(g,R,rnd){disc(g,0,0,R,'#2c3350');disc(g,0,0,R*.94,'#3a4264');g.save();g.rotate(-.5);for(const s of[-1,1]){rr(g,s>0?R*.2:-R*.86,-R*.22,R*.66,R*.44,R*.03,'#2d5fb8');g.strokeStyle='rgba(180,215,255,.7)';g.lineWidth=R*.015;const x0=s>0?R*.2:-R*.86;for(let i=1;i<5;i++){g.beginPath();g.moveTo(x0+i*R*.132,-R*.22);g.lineTo(x0+i*R*.132,R*.22);g.stroke();}g.beginPath();g.moveTo(x0,0);g.lineTo(x0+R*.66,0);g.stroke();}
  rr(g,-R*.2,-R*.24,R*.4,R*.48,R*.05,'#e0b43a');rr(g,-R*.2,-R*.24,R*.4,R*.14,R*.05,'#f3d070');disc(g,0,R*.04,R*.09,'#9aa1b4');g.restore();g.strokeStyle='#cfd5e3';g.lineWidth=R*.03;g.beginPath();g.arc(R*.05,-R*.5,R*.16,0.2,3.0);g.stroke();}
function drawBase(g,R,rnd){disc(g,0,0,R,'#6d7488');disc(g,0,0,R*.94,'#9aa1b4');for(const [x,y,s] of[[-.55,.45,.1],[.6,-.4,.08]])disc(g,R*x,R*y,R*s,'#7d8396');
  g.fillStyle='#2d5fb8';for(const s of[-1,1]){g.beginPath();g.roundRect(s>0?R*.38:-R*.82,R*.3,R*.44,R*.26,R*.02);g.fill();}disc(g,0,0,R*.46,'#e6eaf2');sph(g,R*.4,'#ffffff','#dfe5ee','#aab3c4');disc(g,0,0,R*.14,'#4dabf7');disc(g,-R*.03,-R*.03,R*.05,'rgba(255,255,255,.7)');
  g.strokeStyle='#e6eaf2';g.lineWidth=R*.04;g.beginPath();g.moveTo(R*.44,0);g.lineTo(R*.8,-R*.2);g.stroke();rr(g,R*.78,-R*.34,R*.06,R*.16,0,'#ff5d5d');}
function drawMoon(g,R,rnd){disc(g,0,0,R,'rgba(220,225,245,.25)');sph(g,R*.95,'#f4f5fa','#d3d7e2','#9097ab');for(const [x,y,s] of[[-.3,-.25,.2],[.35,.1,.26],[-.1,.45,.14],[.1,-.55,.1],[-.58,.2,.11],[.55,-.4,.1]]){disc(g,R*x,R*y,R*s,'rgba(110,118,140,.5)');disc(g,R*x-R*s*.15,R*y-R*s*.15,R*s*.8,'rgba(185,190,208,.9)');}gloss(g,R,.82);}
/* solar system */
function drawAster(g,R,rnd){disc(g,0,0,R,'#2a2623');wavy(g,R*.9,R*.09,9,'#6b5f55',.9);wavy(g,R*.78,R*.08,6,'#8a7c6e',2);for(const [x,y,s] of[[-.3,-.2,.16],[.3,.2,.2],[.0,.5,.1],[.4,-.4,.1]]){disc(g,R*x,R*y,R*s,'#5a4f46');disc(g,R*x-R*s*.15,R*y-R*s*.15,R*s*.75,'#7a6c5f');}}
function drawMars(g,R,rnd){sph(g,R,'#ff9a6c','#d9532b','#8f2c12');g.save();clipDisc(g,R);for(let i=0;i<7;i++){const a=rnd()*TAU,r=R*rnd()*.8;g.fillStyle='rgba(110,40,20,.4)';g.beginPath();g.ellipse(Math.cos(a)*r,Math.sin(a)*r,R*.2,R*.1,rnd()*3,0,TAU);g.fill();}ell(g,0,-R*.92,R*.4,R*.18,0,'#fff');g.restore();gloss(g,R,.85);}
function drawSaturn(g,R,rnd){const rx=R*.98,ry=R*.3;g.save();g.rotate(-.35);g.lineWidth=R*.1;g.strokeStyle='#caa760';g.beginPath();g.ellipse(0,0,rx*.82,ry*.82,0,Math.PI,TAU);g.stroke();g.lineWidth=R*.05;g.strokeStyle='#e8d39b';g.beginPath();g.ellipse(0,0,rx*.98,ry*.98,0,Math.PI,TAU);g.stroke();g.restore();
  sph(g,R*.62,'#fff1c4','#e8c46c','#a67c2e');g.save();clipDisc(g,R*.62);g.fillStyle='rgba(150,100,30,.2)';for(let i=-2;i<=2;i++)g.fillRect(-R,i*R*.2,R*2,R*.07);g.restore();
  g.save();g.rotate(-.35);g.lineWidth=R*.1;g.strokeStyle='#caa760';g.beginPath();g.ellipse(0,0,rx*.82,ry*.82,0,0,Math.PI);g.stroke();g.lineWidth=R*.05;g.strokeStyle='#e8d39b';g.beginPath();g.ellipse(0,0,rx*.98,ry*.98,0,0,Math.PI);g.stroke();g.restore();}
function drawJupiter(g,R,rnd){sph(g,R,'#fbe9cf','#d9a56c','#8a5a34');g.save();clipDisc(g,R);const bands=['#c98a57','#f2d3a6','#b87040','#e9bf8b','#a8643a','#f0cc9b'];for(let i=0;i<6;i++){g.fillStyle=bands[i]+'aa';g.beginPath();for(let k=0;k<=20;k++){const x=-R+k*R*.1,y=-R*.8+i*R*.3+Math.sin(k*.8+i)*R*.04;k?g.lineTo(x,y):g.moveTo(x,y);}g.lineTo(R,-R*.8+i*R*.3+R*.15);g.lineTo(-R,-R*.8+i*R*.3+R*.15);g.fill();}
  ell(g,R*.3,R*.3,R*.2,R*.12,0,'#d4452e');ell(g,R*.3,R*.3,R*.12,R*.07,0,'#f08060');const sh=g.createRadialGradient(-R*.3,-R*.3,R*.4,0,0,R);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(30,10,0,.4)');disc(g,0,0,R,sh);g.restore();gloss(g,R,.85);}
function drawSun(g,R,rnd){wavy(g,R,R*.05,14,'rgba(255,170,40,.55)',0);wavy(g,R*.92,R*.04,18,'rgba(255,140,30,.7)',1);const gr=g.createRadialGradient(0,0,R*.1,0,0,R*.85);gr.addColorStop(0,'#fffbe0');gr.addColorStop(.5,'#ffd23a');gr.addColorStop(1,'#ff8a1e');disc(g,0,0,R*.85,gr);
  for(let i=0;i<9;i++){const a=rnd()*TAU,r=R*rnd()*.6;disc(g,Math.cos(a)*r,Math.sin(a)*r,R*.045,'rgba(190,80,10,.35)');}}
/* galaxy */
function drawDwarf(g,R,rnd){disc(g,0,0,R,'rgba(255,90,70,.18)');disc(g,0,0,R*.9,'rgba(255,90,70,.28)');sph(g,R*.72,'#ffb28a','#e84a3a','#8f1e1a');g.save();clipDisc(g,R*.72);for(let i=0;i<5;i++){const a=rnd()*TAU,r=R*rnd()*.5;g.fillStyle='rgba(90,10,10,.3)';g.beginPath();g.ellipse(Math.cos(a)*r,Math.sin(a)*r,R*.12,R*.07,rnd()*3,0,TAU);g.fill();}g.restore();}
function drawBlue(g,R,rnd){for(let i=0;i<10;i++){const a=i/10*TAU;g.fillStyle='rgba(150,200,255,.5)';g.beginPath();g.moveTo(Math.cos(a-.08)*R*.5,Math.sin(a-.08)*R*.5);g.lineTo(Math.cos(a)*R,Math.sin(a)*R);g.lineTo(Math.cos(a+.08)*R*.5,Math.sin(a+.08)*R*.5);g.fill();}
  disc(g,0,0,R*.74,'rgba(120,180,255,.35)');const gr=g.createRadialGradient(0,0,0,0,0,R*.62);gr.addColorStop(0,'#fff');gr.addColorStop(.4,'#bfe0ff');gr.addColorStop(1,'#4d94ff');disc(g,0,0,R*.62,gr);}
function drawNebula(g,R,rnd){disc(g,0,0,R*.98,'rgba(40,20,80,.5)');const cols=['rgba(255,90,180,.45)','rgba(150,90,255,.45)','rgba(80,170,255,.4)','rgba(255,160,90,.35)'];for(let i=0;i<14;i++){const a=rnd()*TAU,r=R*Math.sqrt(rnd())*.6;disc(g,Math.cos(a)*r,Math.sin(a)*r,R*(.2+rnd()*.2),cols[i%4]);}
  for(let i=0;i<26;i++){const a=rnd()*TAU,r=R*Math.sqrt(rnd())*.9;disc(g,Math.cos(a)*r,Math.sin(a)*r,R*(.012+rnd()*.02),'#fff');}}
function drawPulsar(g,R,rnd){disc(g,0,0,R*.98,'rgba(60,40,140,.35)');disc(g,0,0,R*.7,'rgba(110,90,230,.3)');g.save();g.rotate(.5);for(const s of[-1,1]){const gr=g.createLinearGradient(0,0,0,s*R);gr.addColorStop(0,'rgba(200,230,255,.95)');gr.addColorStop(1,'rgba(120,160,255,0)');g.fillStyle=gr;g.beginPath();g.moveTo(-R*.09,0);g.lineTo(0,s*R);g.lineTo(R*.09,0);g.fill();}g.restore();
  disc(g,0,0,R*.24,'rgba(200,230,255,.5)');disc(g,0,0,R*.14,'#fff');}
function drawBlackHole(g,R,rnd){disc(g,0,0,R,'rgba(20,10,40,.7)');g.save();g.scale(1,.5);const gr=g.createRadialGradient(0,0,R*.3,0,0,R);gr.addColorStop(0,'#fff6c8');gr.addColorStop(.35,'#ffb52e');gr.addColorStop(.7,'#d94a1e');gr.addColorStop(1,'rgba(120,30,90,0)');disc(g,0,0,R,gr);g.restore();
  disc(g,0,0,R*.4,'#000');g.strokeStyle='rgba(255,210,120,.9)';g.lineWidth=R*.05;g.beginPath();g.arc(0,0,R*.42,Math.PI*1.05,Math.PI*1.95);g.stroke();g.strokeStyle='rgba(255,170,60,.6)';g.lineWidth=R*.04;g.beginPath();g.arc(0,0,R*.46,.1,Math.PI-.1);g.stroke();}
/* universe */
function drawSpiral(g,R,rnd){disc(g,0,0,R*.98,'rgba(60,40,140,.25)');for(let arm=0;arm<2;arm++)for(let i=0;i<110;i++){const t=i/110,a=arm*Math.PI+t*5.2+(rnd()-.5)*.4,r=R*(.1+t*.85)+(rnd()-.5)*R*.12;disc(g,Math.cos(a)*r,Math.sin(a)*r,R*(.012+(1-t)*.03+rnd()*.02),['#bcd2ff','#fff','#ffd9ec','#9ab8ff'][i%4]);}
  const gr=g.createRadialGradient(0,0,0,0,0,R*.3);gr.addColorStop(0,'#fffbe6');gr.addColorStop(.5,'rgba(255,220,150,.7)');gr.addColorStop(1,'rgba(255,200,120,0)');disc(g,0,0,R*.3,gr);}
function drawQuasar(g,R,rnd){disc(g,0,0,R*.98,'rgba(30,20,80,.45)');g.save();g.rotate(-.9);for(const s of[-1,1]){const gr=g.createLinearGradient(0,0,0,s*R);gr.addColorStop(0,'rgba(180,230,255,.95)');gr.addColorStop(1,'rgba(100,150,255,0)');g.fillStyle=gr;g.beginPath();g.moveTo(-R*.14,0);g.lineTo(-R*.03,s*R);g.lineTo(R*.03,s*R);g.lineTo(R*.14,0);g.fill();}
  g.strokeStyle='rgba(255,190,110,.8)';g.lineWidth=R*.06;g.beginPath();g.ellipse(0,0,R*.5,R*.16,0,0,TAU);g.stroke();g.strokeStyle='rgba(255,120,150,.6)';g.lineWidth=R*.04;g.beginPath();g.ellipse(0,0,R*.68,R*.22,0,0,TAU);g.stroke();g.restore();
  const gr=g.createRadialGradient(0,0,0,0,0,R*.3);gr.addColorStop(0,'#fff');gr.addColorStop(.5,'#cfeaff');gr.addColorStop(1,'rgba(150,200,255,0)');disc(g,0,0,R*.3,gr);}
function drawCluster(g,R,rnd){disc(g,0,0,R*.98,'rgba(50,30,110,.5)');const cols=['#ffe3b0','#cfe0ff','#ffc9e0','#fff'];for(let i=0;i<13;i++){const a=rnd()*TAU,r=R*Math.sqrt(rnd())*.72;g.save();g.translate(Math.cos(a)*r,Math.sin(a)*r);g.rotate(rnd()*3);const s=R*(.1+rnd()*.12);ell(g,0,0,s,s*.4,0,'rgba(140,120,255,.35)');ell(g,0,0,s*.6,s*.25,0,cols[i%4]);disc(g,0,0,s*.14,'#fff');g.restore();}
  for(let i=0;i<24;i++){const a=rnd()*TAU,r=R*Math.sqrt(rnd())*.92;disc(g,Math.cos(a)*r,Math.sin(a)*r,R*.012,'#fff');}}
function drawWeb(g,R,rnd){disc(g,0,0,R*.98,'rgba(20,15,60,.7)');const pts=[];for(let i=0;i<16;i++){const a=rnd()*TAU,r=R*Math.sqrt(rnd())*.85;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
  g.lineCap='round';for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d<R*.62){g.strokeStyle=`rgba(${120+i*7},${150+j*4},255,${.55-d/R*.5})`;g.lineWidth=R*.02;g.beginPath();g.moveTo(pts[i][0],pts[i][1]);g.lineTo(pts[j][0],pts[j][1]);g.stroke();}}
  pts.forEach(([x,y],i)=>{disc(g,x,y,R*.07,'rgba(160,140,255,.35)');disc(g,x,y,R*.035,i%3?'#cfe0ff':'#ffd9ec');});}
function drawCosmos(g,R,rnd){const gr=g.createRadialGradient(0,0,0,0,0,R);gr.addColorStop(0,'#fffbe0');gr.addColorStop(.25,'#ffb4e0');gr.addColorStop(.55,'#8a5af0');gr.addColorStop(1,'#1a0f48');disc(g,0,0,R,gr);
  for(let i=0;i<18;i++){const a=i/18*TAU;g.strokeStyle=`rgba(255,255,255,${.1+(i%3)*.08})`;g.lineWidth=R*.03;g.beginPath();g.moveTo(Math.cos(a)*R*.2,Math.sin(a)*R*.2);g.lineTo(Math.cos(a)*R*.95,Math.sin(a)*R*.95);g.stroke();}
  for(let i=0;i<60;i++){const a=rnd()*TAU,r=R*Math.sqrt(rnd())*.95;disc(g,Math.cos(a)*r,Math.sin(a)*r,R*(.008+rnd()*.015),'#fff');}disc(g,0,0,R*.09,'#fff');}

/* ============ creatures (top-down, facing +x) ============ */
function ell2(g,x,y,rx,ry,c,rot){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,TAU);g.fill();}
function ln(g,x1,y1,x2,y2,c,w){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function poly(g,pts,c){g.fillStyle=c;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();}
/* walking leg: pair i (0..), side s (+-1); returns swing offset */
const swing=(f,i,s)=>Math.sin(f/4*TAU+((i+(s>0?0:1))%2)*Math.PI);
function legsN(g,xs,reach,col,w,f,amp,dx){
  g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';
  xs.forEach((x,i)=>{for(const s of[-1,1]){const o=swing(f,i,s)*(amp||2);g.beginPath();g.moveTo(x,s*reach*.35);g.lineTo(x+(dx||0)+o*.5,s*reach*.75);g.lineTo(x+(dx||0)+o,s*reach);g.stroke();}});
}
function eyes(g,x,y,r,c,sep){for(const s of[-1,1])ell2(g,x,y+s*sep,r,r,c||'#111');}
function tailWave(g,x0,x1,w0,col,f,amp){
  g.fillStyle=col;g.beginPath();const N=10;
  for(let i=0;i<=N;i++){const t=i/N,x=x0+(x1-x0)*t,y=Math.sin(t*3+f/4*TAU)*(amp||1.5)*t,w=w0*(1-t);i?g.lineTo(x,y-w):g.moveTo(x,y-w);}
  for(let i=N;i>=0;i--){const t=i/N,x=x0+(x1-x0)*t,y=Math.sin(t*3+f/4*TAU)*(amp||1.5)*t,w=w0*(1-t);g.lineTo(x,y+w);}
  g.closePath();g.fill();
}

        if(a.st===1){a.st=2;a.t=biteT;}
        else if(a.st===3){deliver(a);}
      } else if(d>2){
        let want=Math.atan2(dy,dx);
        if(d>60*u&&a.st!==0)want+=Math.sin(time*3.1+a.ph)*.5*Math.min(1,(d-60*u)/110);
        let diff=want-a.ang;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
        const mt=(d<45*u?40:10)*dt*(sp0>3?3:1);a.ang+=clamp(diff,-mt,mt);
        const step=Math.min(sp*dt,d);
        a.x+=Math.cos(a.ang)*step;a.y+=Math.sin(a.ang)*step;
        a.leg+=Math.min(step,40)*.075/AS;
        dx=a.tx-a.x;dy=a.ty-a.y;
        if(Math.hypot(dx,dy)<arrive&&a.st!==0){
          if(a.st===1){a.st=2;a.t=biteT;}

    }
  }
}

function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    if(s.delay>0){s.delay-=dt;continue;}
    if(!s.fired){s.fired=true;if(s.k==='shell'||s.k==='boulder'){for(let q=0;q<5;q++)burst(nest.x,nest.y,'#adb5bd',.5,rand(30,90),rand(2,4));}}

  if(holeT>0)holeT=Math.max(0,holeT-dt);

function drawShots(){
  const c=ctx;
  for(const s of shots){
    if(s.delay>0)continue;const k=clamp(s.t/s.dur,0,1);
    const dx=s.x1-s.x0,dy=s.y1-s.y0,ang=Math.atan2(dy,dx);
    let x=s.x0+dx*k,y=s.y0+dy*k;const col=s.w.col;
    switch(s.k){

/* ============ mutations (per run) ============ */
function mutOffer(){
  const rnd=mulberry(hashStr('mut'+S.runs+':'+S.evolves+':'+S.mutPicked+':'+S.stage));
  const pool=MUTS.filter(m=>!S.mut.includes(m.id));
  for(let i=pool.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,3+evo('mutant'));
}
function openMutations(){
  if(S.mutPend<=0||!modal.hidden)return;
  const offer=mutOffer();if(!offer.length){S.mutPend=0;return;}
  showModal(`<h2>🧬 Choose a mutation</h2><p>Lasts until you Ascend. Every mutation has a catch.${S.mutPend>1?` <b>${S.mutPend} picks waiting.</b>`:''}</p>`+
    offer.map(m=>`<button class="mutc" data-act="mutPick" data-arg="${m.id}" style="--c:${m.c}"><b>${m.n}</b><span>${m.d}</span></button>`).join('')+`<button class="btn ghost" data-act="close">Later</button>`);
}
function pickMut(id){
  if(!MU[id]||S.mutPend<=0||S.mut.includes(id))return;
  S.mut.push(id);S.mutPend--;S.mutPicked++;recalcMut();syncAnts();hideModal();
  toast('Mutation: '+MU[id].n,MU[id].d);save();refreshButtons();updateHud(true);
  if(S.mutPend>0)setTimeout(openMutations,350);
}

function checkAch(){
  if(isSr()||rgActive)return;
  for(const a of ACH){if(S.ach[a.id])continue;let ok=false;try{ok=a.f();}catch(e){}
    if(ok){S.ach[a.id]=1;S.achN=Object.keys(S.ach).length;toast('Achievement: '+a.n,a.d+' · +2% income');}}

/* ============ daily bonus ============ */
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const yesterdayKey=()=>{const d=new Date(Date.now()-864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dailyReady=()=>!isSr()&&S.daily.last!==todayKey();
const DAILY_MIN=[5,10,15,20,30,45,90];
function dailyReward(streak){
  const mins=DAILY_MIN[(streak-1)%7],cash=Math.max(S.rateOff*mins*60,pieceValue()*60*mins/5);
  const rj=S.rjTotal>0?Math.max(1,Math.floor(S.rjTotal*.01*((streak-1)%7+1))):0;
  return{cash,rj,egg:(streak%7===0),dna:(streak%7===0&&S.dnaTotal>0)?1:0,mins};
}
function claimDaily(){
  if(!dailyReady())return;
  const streak=(S.daily.last===yesterdayKey()?S.daily.streak:0)+1,r=dailyReward(streak);
  S.daily.last=todayKey();S.daily.streak=streak;
  gain(r.cash,true);S.rj+=r.rj;S.rjTotal+=r.rj;S.rjEra+=r.rj;if(r.egg)S.eggs.n=Math.min(3,S.eggs.n+1);if(r.dna){S.dna+=1;S.dnaTotal+=1;S.dnaEra+=1;}
  checkConquest();save();updateHud(true);
  showModal(`<h2>🎁 Daily bonus</h2><p>Day ${streak} of your streak</p><div class="big">+$${fmt(r.cash)}</div>${r.rj?`<p>+${r.rj} Royal Jelly</p>`:''}${r.egg?'<p>+1 Egg 🥚</p>':''}${r.dna?'<p>+1 DNA 🧬</p>':''}<button class="btn good" data-act="close">Thanks!</button>`);
  moreSig='';
}
/* ============ hatchery (queen eggs) ============ */
const eggTime=()=>240*(1-.25*evo('hatch'));
function stepEggs(dt){
  if(isSr())return;
  if(S.eggs.n<3){S.eggs.t+=dt;const T=eggTime();while(S.eggs.t>=T&&S.eggs.n<3){S.eggs.t-=T;S.eggs.n++;toast('An egg is ready!','Open More › Hatchery');}if(S.eggs.n>=3)S.eggs.t=0;}
}
let egg=null;
function openEgg(){
  if(S.eggs.n<=0||isSr())return;
  egg={heat:0,dir:1,tries:0,score:0,pos:0};
  renderEgg();egg.timer=setInterval(eggTick,30);
}
function eggTick(){
  if(!egg||modal.hidden){clearInterval(egg&&egg.timer);egg=null;return;}
  egg.pos+=egg.dir*.022*(1+egg.tries*.25);if(egg.pos>=1){egg.pos=1;egg.dir=-1;}if(egg.pos<=0){egg.pos=0;egg.dir=1;}
  const m=document.getElementById('eggMark');if(m)m.style.left=(egg.pos*100)+'%';
}
function renderEgg(){
  const done=egg.tries>=5;
  showModal(`<h2>🥚 Warm the egg</h2><p>Tap <b>Warm</b> when the marker is in the green zone. 5 tries.</p>
   <div class="eggbar"><i class="zone"></i><i id="eggMark" class="mark" style="left:${egg.pos*100}%"></i></div>
   <div class="eggheat"><span style="width:${egg.score/5*100}%"></span></div><p style="margin:4px 0 8px">Warmth ${egg.score}/5 · try ${Math.min(5,egg.tries+1)}/5</p>
   <button class="btn pink" data-act="eggTap">Warm!</button><button class="btn ghost" data-act="eggStop">Close</button>`);
}
function eggTap(){
  if(!egg)return;
  const ok=Math.abs(egg.pos-.5)<.11;if(ok)egg.score++;egg.tries++;
  const m=document.getElementById('eggMark');
  if(egg.tries>=5){clearInterval(egg.timer);hatch(egg.score);egg=null;return;}
  renderEgg();toast(ok?'Warm!':'Missed',ok?'The egg glows':'');
}
function hatch(score){
  S.eggs.n--;S.eggs.hatched++;if(S.eggs.n<3&&S.eggs.t<=0)S.eggs.t=0;
  const q=score+(evo('hatch')>0?1:0),rnd=Math.random();
  let msg='',title='Hatched!';
  const mins=[3,6,12,25,50,120][clamp(q,0,5)];
  const cash=Math.max(S.rateOff*mins*60,pieceValue()*60*mins/6);gain(cash,true);msg=`<div class="big">+$${fmt(cash)}</div>`;
  if(q>=3&&S.rjTotal>0){const rj=Math.max(1,Math.floor(S.rjTotal*.005*q));S.rj+=rj;S.rjTotal+=rj;S.rjEra+=rj;msg+=`<p>+${rj} Royal Jelly</p>`;}
  if(q>=4&&rnd<.5&&!isSr()){S.mutPend++;msg+='<p>+1 free mutation 🧬</p>';}
  if(q>=5&&S.dnaTotal>0&&rnd<.6){S.dna++;S.dnaTotal++;S.dnaEra++;msg+='<p>+1 DNA</p>';}
  if(score===0)title='A sleepy hatchling';
  checkConquest();save();updateHud(true);moreSig='';
  showModal(`<h2>🐣 ${title}</h2><p>Warmth ${score}/5</p>${msg}<button class="btn good" data-act="close">Nice!</button>`);
}

/* ============ prestige actions: tier / evolve / transcend ============ */
function resetAfterPrestige(){
  ants.length=0;parts.length=0;floats.length=0;meteors.length=0;golden=null;shots.length=0;dots.length=0;booms.length=0;evList.length=0;evRain=0;holeFx=null;holeT=0;
  checkUnlocks(true);recalcMut();syncAnts();changeBG();Fd=null;spawnFood(0,0);
  incomeAcc=0;offAcc=0;S.warpT=0;S.frenzy=0;
  buildSprites();updateUnitIcon();refreshLoadout();
}
function buyTier(){
  if(isSr()||S.tier>=7)return false;
  const c=TIER_COST[S.tier+1];if(S.dna<c){return false;}
  S.dna-=c;S.tier++;if(S.tier===1&&!S.seen.arch)S.seen.arch=1;
  syncAnts();buildSprites();updateUnitIcon();
  const nm=SPEC_NAME[curSpec()];flash=.7;flashCol='#12b886';shake=.6;
  for(let i=0;i<50;i++)burst(rand(0,W),rand(hudB,panelT),['#12b886','#fff','#ffd43b'][i%3],1.2,rand(40,200),rand(2,5));
  toast('Evolved into '+nm+'!','Income x'+fmt(TIER_MUL[S.tier]/TIER_MUL[S.tier-1])+' · '+TIER_NAME[S.tier]);
  save();refreshButtons();updateHud(true);evSig='';return true;
}
function setArch(i){
  if(isSr()||S.tier<1||i===S.arch)return;
  if(S.runTime>300){toast('Lineage is locked','Change it in the first 5 minutes of a run, or when you Evolve');return;}
  S.arch=i;syncAnts();buildSprites();updateUnitIcon();save();refreshButtons();updateHud(true);evSig='';
}
function doEvolve(arch){
  const g=dnaGain();if(g<1||isSr())return;
  const jelly=evolveJelly();
  S.dna+=g;S.dnaTotal+=g;S.dnaEra+=g;S.evolves++;
  if(jelly>0){S.rj+=jelly;S.rjTotal+=jelly;S.rjEra+=jelly;}
  S.runs++;
  if(arch!=null&&S.tier>=1)S.arch=arch;
  S.depthEra=0;
  S.bestStage=Math.max(S.bestStage,S.stage);
  freshRun(S);S.runTime=0;S.eaten=0;S.pieces=0;
  resetAfterPrestige();
  flash=1;flashCol='#12b886';
  toast('Evolved!','+'+fmt(g)+' DNA'+(jelly>0?' · +'+fmt(jelly)+' Royal Jelly':'')+' · keep skills & jelly');
  save();refreshButtons();updateHud(true);updateAbilities();skSig='';cqSig='';evSig='';
  setTab(2);
}
function doTranscend(){
  const g=essGain();if(g<1||isSr())return;
  const dg=dnaGain(),jelly=transcendJelly();
  S.essence+=g;S.essTotal+=g;S.transcends++;
  if(dg>0){S.dna+=dg;S.dnaTotal+=dg;}
  if(jelly>0){S.rj+=jelly;S.rjTotal+=jelly;S.rjEra+=jelly;S.runs++;}
  if(cos('primal'))S.tier=Math.min(7,S.tier+cos('primal'));
  S.dnaEra=0;S.depthEra=0;
  S.bestStage=Math.max(S.bestStage,S.stage);
  freshRun(S);S.runTime=0;S.eaten=0;S.pieces=0;
  S.load=S.load.map(id=>id);
  resetAfterPrestige();
  flash=1;flashCol='#da77f2';
  const bits=['+'+fmt(g)+' Cosmic Essence'];
  if(dg>0)bits.push('+'+fmt(dg)+' DNA');
  if(jelly>0)bits.push('+'+fmt(jelly)+' Royal Jelly');
  toast('Transcended!',bits.join(' · ')+' · keep DNA, skills & jelly');
  save();refreshButtons();updateHud(true);updateAbilities();skSig='';cqSig='';evSig='';
  setTab(2);
}
function buyEvo(id){
  const e=EV[id],l=evo(id);if(!e||l>=e.max)return false;const c=evoCost(id,l);
  if(S.dna<c)return false;S.dna-=c;S.evo[id]=l+1;
  if(id==='armory')refreshLoadout();
  if(id==='mutant'||id==='ancestral'){/*applies later*/}
  toast(e.n+' '+(l+1),e.d(l+1));save();updateHud(true);evSig='';return true;
}
function buyCos(id){
  const e=CO[id],l=cos(id);if(!e||l>=e.max)return false;const c=cosCost(id,l);
  if(S.essence<c)return false;S.essence-=c;S.cos[id]=l+1;
  toast(e.n+' '+(l+1),e.d(l+1));save();updateHud(true);evSig='';return true;
}
function buyWeapon(id){
  const w=WP[id];if(!w||isSr())return false;
  const l=S.wp[id]||0;
  if(l>=5)return false;
  const c=l===0?w.cost:wUpCost(w,l),cur=w.cur==='dna'?'dna':'essence';
  if(S[cur]<c)return false;
  S[cur]-=c;S.wp[id]=l+1;
  if(l===0){const slots=slotCount();let i=S.load.slice(0,slots).indexOf(null);if(i<0)i=S.load.slice(0,slots).indexOf(0);if(i>=0&&!S.load.includes(id))S.load[i]=id;}
  refreshLoadout();toast(l===0?w.n+' unlocked!':w.n+' level '+(l+1),w.d);save();updateHud(true);updateAbilities();evSig='';return true;
}
function equipWeapon(id){
  if(!S.wp[id])return;
  const slots=slotCount();
  const i=S.load.indexOf(id);
  if(i>=0&&i<slots){S.load[i]=null;}
  else{let j=S.load.slice(0,slots).findIndex(x=>!x);if(j<0)j=0; // replace the first slot when full
    if(i>=0)S.load[i]=null;S.load[j]=id;}
  refreshLoadout();save();updateAbilities();evSig='';
}

  b.addEventListener('click',e=>{e.preventDefault();buy(k);});

function quote(k){
  const lv=S.lv[k],cap=upMax(k)-lv;
  if(cap<=0)return{n:0,cost:0,maxed:true};
  let n;
  if(S.bulk===1)n=1;
  else if(S.bulk===10)n=Math.min(10,cap);
  else{n=0;let spent=0;while(n<cap&&n<1000){const c=costOne(k,lv+n);if(spent+c>S.money)break;spent+=c;n++;}if(n===0)n=1;}
  const cost=costN(k,lv,n);
  return{n,cost:isFinite(cost)?cost:Infinity,maxed:false};
}
function refreshButtons(){
  for(const k of KEYS){
    const B=btns[k];
    if(!S.unl[k]){if(B.shown){B.shown=false;B.el.classList.add('hide');}continue;}
    if(!B.shown){B.shown=true;B.el.classList.remove('hide');B.el.classList.add('newu');setTimeout(()=>B.el.classList.remove('newu'),600);}

/* ============ offline ============ */
function offlineCheck(){
  const away=(Date.now()-S.ts)/1000;
  if(away<20||!modal.hidden||isSr()||rgActive)return;
  S.warpT=Math.max(0,S.warpT-away);S.warpCd=Math.max(0,S.warpCd-away);S.meteorCd=Math.max(0,S.meteorCd-away);S.frenzy=0;S.rushT=0;
  for(const id in S.wCd)S.wCd[id]=Math.max(0,S.wCd[id]-away);
  if(S.eggs.n<3){S.eggs.t+=Math.min(away,86400);const T=eggTime();while(S.eggs.t>=T&&S.eggs.n<3){S.eggs.t-=T;S.eggs.n++;}if(S.eggs.n>=3)S.eggs.t=0;}
  if(S.rateOff<=0)return;
  const secs=Math.min(away,offlineCap()),earn=S.rateOff*secs*offlineRate();
  if(earn<1)return;
  const before=S.stage;
  gain(earn,true);checkConquest();save();
  const capped=away>secs;
  showModal(`<h2>Welcome back!</h2><p>Your colony kept working for ${fmtTime(away)}${capped?` (max ${Math.round(offlineCap()/3600)}h)`:''}.</p><div class="big">+$${fmt(earn)}</div><p>collected while you were away${S.stage>before?`<br><b>and conquered ${S.stage-before} stage${S.stage-before>1?'s':''}!</b>`:''}</p><button class="btn good" id="ok">Nice!</button>`,c=>{c.querySelector('#ok').onclick=()=>{hideModal();};});
  updateHud(true);refreshButtons();
}

  for(const id of Object.keys(abBtns)){

    if(id.startsWith('w:')){
      const w=WP[id.slice(2)],cd=S.wCd[w.id]||0,tot=w.aCd*wCdMul();
      if(cd>0){frac=1-cd/tot;txt=Math.ceil(cd)+'s';cls='ab cd';}else{frac=1;txt='';cls='ab ready';}
    }else{
      const own=!!sk(id);B.el.style.display=own?'':'none';if(!own)continue;
      if(id==='warp'&&S.warpT>0){frac=S.warpT/warpDur();txt=Math.ceil(S.warpT)+'s';cls='ab act';}

    if(sig!==B.last){B.last=sig;B.el.className=cls;B.tm.textContent=txt;B.rf.style.strokeDashoffset=(163.4*(1-frac)).toFixed(1);}

function rgCalc(run){
  const b=RG_SP[run.sp]||RG_SP.ant;
  const st={hpMax:b.hp,units:b.units,atk:b.atk,rate:b.rate,crit:b.crit,critMul:0,armor:b.armor||0,regen:0,poison:b.poison||0,pm:0,thorns:0,gold:b.gold||0,tap:0,cd:0,actDmg:0,killHeal:0,dodge:0,vuln:0,choices:3,luck:0,shop:0,atkP:0,tags:{},acts:[]};
  const add=m=>{for(const k in m){if(k==='atk')st.atkP+=m[k];else if(k==='hp')st.hpMax+=m[k];else if(k in st&&typeof st[k]==='number')st[k]+=m[k];}};
  for(const id in run.perks){const p=RP[id];if(!p)continue;const n=run.perks[id];for(let i=0;i<n;i++)add(p.mods);for(const t of p.tags)st.tags[t]=(st.tags[t]||0)+n;if(p.act)st.acts.push(p.act);}
  st.synergy=[];
  for(const t in RG_SYN)for(const [need,txt,m] of RG_SYN[t])if((st.tags[t]||0)>=need){add(m);st.synergy.push([t,need,txt]);}
  for(const s of run.starters){
    if(s==='st_hp')st.hpMax+=6;else if(s==='st_units')st.units+=3;else if(s==='st_atk')st.atkP+=.3;else if(s==='st_regen')st.regen+=1;
  }
  for(const id of run.mods){const m=RG_BOONS.find(x=>x.id===id);if(m){add(m.m);}
    const bn=RG_BANES.find(x=>x.id===id);if(bn){if(bn.b==='famine')st.units-=3;if(bn.b==='brittle')st.hpMax-=4;}}
  st.hpMax=Math.max(8,st.hpMax+(run.hpBonus||0));st.units=Math.max(1,Math.round(st.units+(run.unitBonusPerm||0)-(run.unitLost||0)));st.atkP+=run.atkBonus||0;
  st.rate=Math.max(.3,st.rate*(1+0)+0);const rateMul=1+(st.rate-b.rate);   // perks add to rate additively on top of species rate
  st.rateEff=Math.max(.3,b.rate+(st.rate-b.rate));
  st.cd=Math.min(.7,st.cd);st.dodge=Math.min(.6,st.dodge);st.crit=Math.min(.9,st.crit);
  st.hit=st.atk*st.units*(1+st.atkP);
  st.bane=b2=>run.mods.some(id=>{const x=RG_BANES.find(y=>y.id===id);return x&&x.b===b2;});
  st.price=1-clamp(st.shop,-.5,.5);
  return st;
}

  const mods=[boon.id,...banes.slice(0,1+heat).map(b=>b.id)];

/* ---- map ---- */
function rgOptions(run){
  const f=run.floor+1,rnd=rngFor(run.seed,'map'+f),st=rgCalc(run);
  if(RG_BOSS.includes(f))return[{type:'boss',i:0}];
  if(RG_REST.includes(f))return[{type:'rest',i:0},{type:'shop',i:1}];
  const pred=st.bane('pred');
  const W_={food:30,fight:28,elite:f>=3?(pred?20:10):0,event:18,shop:8,treasure:4};
  const n=rnd()<.45?3:2,out=[],used={};
  for(let i=0;i<n;i++){
    let tot=0;for(const k in W_)if(!used[k])tot+=W_[k];let r=rnd()*tot,pick='food';
    for(const k in W_){if(used[k])continue;r-=W_[k];if(r<=0){pick=k;break;}}
    used[pick]=1;out.push({type:pick,i});
  }
  return out;
}
function rgMap(){

    opts.map(o=>{const hide=fog&&o.type!=='boss'&&o.type!=='rest';return`<button class="node ${hide?'':o.type}" data-act="rgPick" data-arg="${o.i}"><span class="ni">${hide?'❔':RG_ICO[o.type]}</span><span class="nt"><b>${hide?'Unknown':RG_NAME[o.type]}</b><small>${hide?'Fog hides the path':RG_HINT[o.type]}</small></span></button>`;}).join('')+nextHint+
    `<div class="rgseed">${run.daily?'Daily ':'Seed '}<b>${run.seed}</b> · ${run.mods.map(id=>(RG_BOONS.find(x=>x.id===id)||RG_BANES.find(x=>x.id===id)).n).join(', ')}</div><button class="btn ghost" data-act="rgQuit">Abandon run</button>`);

function rgResolve(o){

  if(o.type==='event')return rgEvent();

/* ---- battles ---- */

    return out;

  const pool=Object.keys(RG_EN).filter(k=>RG_EN[k].min<=f);
  const n=o.type==='elite'?1:(f<3?1:(rnd()<.5?1:(f>8&&rnd()<.4?3:2)));
  for(let i=0;i<n;i++){
    const id=pool[(rnd()*pool.length)|0],d=RG_EN[id];
    const el=o.type==='elite';
    const e={id,n:(el?'Elite ':'')+d.n,sp:d.sp,t:d.t,hp:H*d.hp*(el?2:1)/Math.pow(n,.8),dmg:(RGK.ed0+RGK.ed1*f)*d.dmg*(el?1.5:1)*heat,int:d.int*(st.bane('frenzy')?.8:1),armor:(d.armor||0)+(d.t==='armor'?1+f*.12:0),w:d.w*(el?1.2:1),elite:el?1:0,aff:[]};

const rgAlive=()=>B.en.filter(e=>e.alive);

function rgStep(dt){
  const run=S.rg.run;if(!run||!B||B.done)return;
  if(modal.hidden===false)return;
  const real=dt;dt*=rgSpeed*RG_TIME;
  const st=rgCalc(run);B.t+=dt;run.t+=real;
  for(const id in B.cd)if(B.cd[id]>0)B.cd[id]=Math.max(0,B.cd[id]-dt);
  if(B.haste>0)B.haste-=dt;if(B.stunned>0)B.stunned-=dt;
  let al=rgAlive();if(!al.length){rgWin();return;}
  if(B.target>=al.length)B.target=0;
  /* colony attack */
  B.atkT-=dt*st.rateEff*(B.haste>0?2:1);
  while(B.atkT<=0&&al.length){
    B.atkT+=.5;const tg=al[Math.min(B.target,al.length-1)];
    const [d,crit]=rgHitDmg(st);if(crit&&B.focus>0)B.focus--;
    if(tg.t==='dodge'&&Math.random()<.25){floatText(rgEnemyPos(tg).x,rgEnemyPos(tg).y-20,'miss','#aaa',.6,.9);}
    else {rgDamage(tg,d,crit,'hit');if(st.poison)tg.poison+=st.poison;}
    B.lunge=1;B.hitCt++;
    if(tg.elite&&tg.aff.includes('thorny')&&B.hitCt%3===0){run.hp-=1;rgRedFlash=.3;}
    al=rgAlive();
  }
  /* poison + regen ticks */
  B.tick+=dt;
  while(B.tick>=.5){B.tick-=.5;
    for(const e of rgAlive()){
      if(e.poison>.2){rgDamage(e,e.poison*.25*(1+st.pm),false,'dot');e.poison*=.9;if(e.poison<.3)e.poison=0;}
      if(e.t==='regen'&&e.alive){e.hp=Math.min(e.max,e.hp+e.max*.01);}
      if(e.boss&&e.t==='tongue'&&e.alive)e.hp=Math.min(e.max,e.hp+e.max*.004);
    }
    if(B.poisonColony>0){B.poisonColony--;run.hp-=.5;}
  }
  /* enemies */
  for(const e of rgAlive()){
    if(e.fd)continue;
    e.shake=Math.max(0,e.shake-real*4);e.flash=Math.max(0,e.flash-real);
    let rate=1;if(e.t==='enrage'&&e.hp<e.max*.5)rate=1.6;if(e.t==='stomp'&&e.hp<e.max*.5)rate=1.5;
    e.atkT-=dt*rate;
    if(e.atkT<=0){
      e.atkT+=e.int;e.shake=1;
      let dmg=e.dmg*(1+st.vuln);if(e.t==='crit'&&Math.random()<.3)dmg*=2;if(e.t==='swoop')dmg*=1.3;
      if(Math.random()<st.dodge){floatText(rgAr.w*.2,rgAr.y+rgAr.h*.4,'dodged','#aee',.7,.9);}
      else if(B.block>0){B.block--;floatText(rgAr.w*.2,rgAr.y+rgAr.h*.4,'blocked','#8ab4ff',.7,1);}
      else{
        const real=Math.max(1,Math.round(dmg-st.armor));run.hp-=real;rgRedFlash=.35;shake=Math.max(shake,.25);
        floatText(rgAr.w*.2,rgAr.y+rgAr.h*.35,'-'+real,'#ff6b6b',.9,1.2);
        if(st.thorns){const t0=rgEnemyPos(e);rgDamage(e,st.thorns,false,'dot');}
        if(e.t==='toxic'){B.poisonColony=Math.min(8,B.poisonColony+4);}
        if(e.t==='stun'&&Math.random()<.5){B.stunned=2;toast('Stunned!','Abilities and taps disabled');}
        if(e.t==='swat'&&Math.random()<.6){run.unitLost=(run.unitLost||0)+1;floatText(rgAr.w*.15,rgAr.y+rgAr.h*.55,'-1 unit','#ff922b',.9,1);}
      }
    }

      e.sT-=dt;
      if(e.sT<=0){e.sT=e.t==='web'?10:e.t==='tongue'?9:e.t==='stomp'?7:e.t==='swoop'?6:e.t==='charge'?8:9;
        if(e.t==='web'){B.atkT+=1.2;B.haste=0;toast('Webbed!','Your attacks slow down');B.stunned=1.2;}
        if(e.t==='tongue'){B.stunned=2.5;toast('Stunned!','The tongue lashes out');}
        if(e.t==='stomp'){run.unitLost=(run.unitLost||0)+2;run.hp-=2;rgRedFlash=.5;shake=1;toast('Stomp!','-2 units');}
        if(e.t==='charge'){run.hp-=Math.max(1,Math.round(e.dmg*1.5-st.armor));rgRedFlash=.5;shake=.8;toast('Charge!');}
        if(e.t==='swoop'){run.hp-=Math.max(1,Math.round(e.dmg*2-st.armor));rgRedFlash=.5;shake=.6;toast('Swoop!');}

function rgWin(){

/* ---- perk offers ---- */
function rgOfferPerks(kind){
  const run=S.rg.run,st=rgCalc(run);run.phase='reward';
  const rnd=rngFor(run.seed,'perk'+run.floor+':'+run.rerollN+':'+kind),f=run.floor;
  const luck=st.luck+(kind==='elite'?20:kind==='boss'||kind==='treasure'?50:0);
  const pool=RG_PERKS.filter(p=>(!p.unl||rgOwned(p.unl))&&(run.perks[p.id]||0)<p.max);
  const n=3+st.choices-(0);
  const picks=[];
  const wR=[Math.max(10,62-f*2.4-luck),30,8+f*1.2+luck*.5,2+f*.25+luck*.25];
  if(kind==='boss'||kind==='treasure'){wR[0]=0;wR[1]=Math.max(5,25-f);}
  let guard=0;
  while(picks.length<n&&guard++<80){
    let tot=wR.reduce((a,b)=>a+b,0),r=rnd()*tot,rar=0;for(let i=0;i<4;i++){r-=wR[i];if(r<=0){rar=i;break;}}
    let cand=pool.filter(p=>p.r===rar&&!picks.includes(p)&&!(p.cursed&&kind!=='fight'&&kind!=='elite'&&rnd()<.5));
    if(!cand.length)continue;
    if(!picks.some(p=>p.cursed)&&rnd()<.18&&f>1){const cc=pool.filter(p=>p.cursed&&!picks.includes(p));if(cc.length)cand=cc;}
    picks.push(cand[(rnd()*cand.length)|0]);
  }
  run.offer={kind,ids:picks.map(p=>p.id)};
  save();rgShowOffer();
}

  else if(S.autoAsc&&canAscend()&&ascendGain()>=Math.max(ASC_MIN,S.rjTotal*.7)&&S.runTime>20){doAscend();}
}
function step(dt){

}
function frame(t){

        if(S.tier!==mt){if(S.tier>mt)log.push({ev:'tier',tier:S.tier,at:+(S.playTime/60).toFixed(1),tr:S.transcends,asc:S.runs});mt=S.tier;}
        if(S.stage!==stg){log.push({ev:'stage',from:stg,to:S.stage,run:S.runs,at:+(S.playTime/60).toFixed(1)});stg=S.stage;}
        if(botT>=1){botT=0;
          if(!modal.hidden)hideModal();
          if(golden)tapGolden();
          if(sk('warp')&&!S.warpT&&!S.warpCd)useWarp();
          if(sk('meteor')&&!S.meteorCd)useMeteor();
          for(const w of WL)if(!(S.wCd[w.id]>0))useWeapon(w.id);
          if(S.mutPend>0){botMut();}
          buyAll();
          const g=ascendGain();
          if(!o.noAscend&&g>=ASC_MIN&&g>=Math.max(ASC_MIN,S.rjTotal*pol)){log.push({ev:'ascend',n:S.runs+1,gain:g,run:+(S.runTime/60).toFixed(1),at:+(S.playTime/60).toFixed(1),stage:S.stage,cyc:S.cycle});
            if(!o.noEvolve&&canEvolve()&&((S.tier<7?S.dna+dnaGain()>=TIER_COST[S.tier+1]:dnaGain()>=Math.max(1,Math.ceil(S.dnaTotal*epol)))||(S.playTime-lastEvo>(o.evoWait||15)*60&&dnaGain()>=Math.max(1,.15*(S.tier<7?TIER_COST[S.tier+1]:1))))){lastEvo=S.playTime;const dg=dnaGain();log.push({ev:'evolve',n:S.evolves+1,dna:dg,rjEra:S.rjEra,tier:S.tier,at:+(S.playTime/60).toFixed(1),cyc:S.cycle,stage:S.stage});
              if(!o.noTranscend&&canTranscend()&&essGain()>=Math.max(o.transMin||1,Math.ceil(S.essTotal*tpol))){log.push({ev:'transcend',n:S.transcends+1,ess:essGain(),at:+(S.playTime/60).toFixed(1),dnaEra:S.dnaEra});doTranscend();essShop();}
              doEvolve(null);stg=S.stage;dnaShop();skills();}
            else{doAscend();stg=S.stage;skills();}}
          if(!o.noEvolve){dnaShop();}
          if(S.won&&!log.some(l=>l.ev==='won')){log.push({ev:'won',at:+(S.playTime/60).toFixed(1),runs:S.runs});if(o.stopOnWin)break;}
          if(o.stopOnAscendable&&canAscend()){log.push({ev:'ascendable',at:+(S.playTime/60).toFixed(1),stage:S.stage,gain:g});break;}
          if(o.stopOnEvolvable&&canEvolve()){log.push({ev:'evolvable',at:+(S.playTime/60).toFixed(1),stage:S.stage,dna:dnaGain(),rjEra:S.rjEra});break;}
        }
      }
      return log;},
    foodsSheet(){const cols=10,cell=96;const rows=SV.length;const c=document.createElement('canvas');c.width=cols*cell;c.height=rows*cell;const g=c.getContext('2d');
      SV.forEach((V,r)=>{g.fillStyle=V.bg;g.fillRect(0,r*cell,cols*cell,cell);V.foods.forEach((f,i)=>{g.save();g.translate(i*cell+cell/2,r*cell+cell/2);f.draw(g,40,mulberry(i*7+r));g.restore();});});return c.toDataURL('image/png');},
    creatureSheet(dark){
      const ids=Object.keys(CR),cols=5,cw=150,ch=110,rows=Math.ceil(ids.length/cols);
      const c=document.createElement('canvas');c.width=cols*cw;c.height=rows*ch;const g=c.getContext('2d');g.fillStyle=dark?'#171b2b':'#f4f1e6';g.fillRect(0,0,c.width,c.height);
      ids.forEach((id,i)=>{const sh=makeSheet(id,dark?1:0,2);const x=(i%cols)*cw,y=Math.floor(i/cols)*ch;g.drawImage(sh.cvs[1],x+cw/2-sh.cvs[1].width/2,y+ch/2-sh.cvs[1].height/2);g.fillStyle=dark?'#fff':'#222';g.font='11px sans-serif';g.textAlign='center';g.fillText(id,x+cw/2,y+ch-6);});
      return c.toDataURL('image/png');}
  };
}

})();
</script>
