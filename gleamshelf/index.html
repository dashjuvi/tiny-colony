<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1220;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:#f3efe6;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%}
.glass{background:rgba(14,20,36,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,220,150,.14);box-shadow:0 8px 28px rgba(0,0,0,.45)}
#top{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 6px);border-radius:16px;padding:7px 8px 6px;z-index:5}
#stats{display:flex;gap:4px}
.chip{flex:1;min-width:0;background:rgba(255,255,255,.06);border-radius:10px;padding:3px 4px;text-align:center}
.chip b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{font-style:normal;font-size:9px;color:#c9b48a;display:block}
#bar2{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-top:4px;padding:0 2px;gap:6px}
#quota{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
#quota i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6d365,#fda085);border-radius:5px;transition:width .2s}
#quota span{position:absolute;inset:0;font-size:8px;text-align:center;line-height:8px;font-weight:800;color:#1a1408;mix-blend-mode:overlay}
#timer{font-variant-numeric:tabular-nums;color:#9cd1ff;font-weight:700}
button{font:inherit;color:#fff;border:0;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:800;background:linear-gradient(180deg,#e0a44a,#b06a14);box-shadow:0 2px 0 #6a3e08,inset 0 1px 0 rgba(255,255,255,.35)}
button:active{transform:translateY(1px)}
button.g{background:linear-gradient(180deg,#3ecf7a,#1c8a48);box-shadow:0 2px 0 #0f5a2c,inset 0 1px 0 rgba(255,255,255,.3)}
button.b{background:linear-gradient(180deg,#4c8dff,#2a4fc8);box-shadow:0 2px 0 #1a3280,inset 0 1px 0 rgba(255,255,255,.3)}
button.p{background:linear-gradient(180deg,#c084fc,#7c3aed);box-shadow:0 2px 0 #4c1d95,inset 0 1px 0 rgba(255,255,255,.3)}
button.r{background:linear-gradient(180deg,#ff6b6b,#c0392b);box-shadow:0 2px 0 #7a1f16,inset 0 1px 0 rgba(255,255,255,.3)}
button.dim{background:linear-gradient(180deg,#3a4558,#2a3344);box-shadow:0 2px 0 #1a2030,inset 0 1px 0 rgba(255,255,255,.12);color:#d0d6e0}
button:disabled{opacity:.45;filter:grayscale(.5)}
button small{display:block;font-weight:600;font-size:10px;opacity:.9}
#dock{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);border-radius:18px;padding:8px;z-index:5;display:none}
#types{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px}
.tb{flex:0 0 auto;min-width:58px;text-align:center;border-radius:12px;padding:6px 7px;background:rgba(255,255,255,.06);font-size:11px;font-weight:800;border:2px solid transparent}
.tb.on{border-color:#f6d365;background:rgba(246,211,101,.15)}
.tb .ic{font-size:20px;display:block}
#hud2{display:flex;gap:6px;margin-top:6px}
#hud2 button{flex:1}
#sheet,#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55)}
#sheet .box,#modal .box{border-radius:20px;padding:14px;width:100%;max-width:420px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#sheet h2,#modal h2{margin:0 0 8px;font-size:20px;text-align:center}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.05);border-radius:14px;padding:9px;border:1px solid rgba(255,255,255,.08)}
.card .ic{font-size:28px;width:40px;text-align:center}
.card .tx{flex:1;min-width:0;font-size:12px;color:#c9c3b6}
.card .tx b{display:block;color:#fff;font-size:14px}
.card.common{border-color:#9aa}
.card.rare{border-color:#5ab0ff}
.card.epic{border-color:#c084fc}
.card.legendary{border-color:#f6d365;box-shadow:0 0 12px rgba(246,211,101,.25)}
.row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px;margin-bottom:6px}
.row .tx{flex:1;font-size:12px;color:#c9c3b6}.row .tx b{display:block;color:#fff;font-size:13.5px}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.seg div{padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.07);font-size:12px;font-weight:800}
.seg div.on{background:#b06a14}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 92px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:30}
.toast{padding:7px 12px;border-radius:12px;font-size:12.5px;font-weight:800;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#title{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 16px calc(env(safe-area-inset-bottom) + 24px);background:linear-gradient(180deg,transparent 30%,#0c1220 70%)}
#title h1{font-size:42px;margin:0;letter-spacing:-1px;background:linear-gradient(180deg,#fff6d0,#f6d365 40%,#c9a227);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;font-weight:900}
#title p{margin:4px 0 14px;color:#c9b48a;text-align:center;font-size:14px}
#title .btns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px}
.rare-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.common .rare-tag{color:#bbb}.rare .rare-tag{color:#7ec8ff}.epic .rare-tag{color:#e0b0ff}.legendary .rare-tag{color:#f6d365}
#aim{position:fixed;pointer-events:none;z-index:4;display:none}
#banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;text-align:center;pointer-events:none;z-index:12;text-shadow:0 4px 16px #000;opacity:0;transition:opacity .2s}
#autoBtn.on{box-shadow:0 0 14px #3dff9a,0 2px 0 #0f5a2c;background:linear-gradient(180deg,#3ecf7a,#1c8a48)}
table{width:100%;font-size:11.5px;border-collapse:collapse}td{padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.gn{color:#6dff9a}.rd{color:#ff8b8b}

.card{position:relative;overflow:hidden}
.card.legendary:after,.card.epic:after{content:"";position:absolute;inset:-2px;pointer-events:none;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%);animation:shim 3.2s ease-in-out infinite}
@keyframes shim{to{transform:translateX(120%)}}
#top{box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,230,160,.15)}
.chip b{letter-spacing:-.02em}
#quota i{box-shadow:0 0 8px rgba(253,160,133,.5)}
#title h1{filter:drop-shadow(0 2px 0 #6a3e08)}

<canvas id="cv"></canvas>

<div id="banner"></div>

</div>
<div id="dock" class="glass">

  <div id="hud2">

    <button class="g" id="autoBtn" onclick="toggleAuto()" style="display:none">🤖 AUTO</button>
    <button class="b" id="dropHint">Drag to drop</button>
  </div>
</div>
<div id="toasts"></div>
<div id="title">

    <button class="g" onclick="startRun(0)">▶ New run</button>
    <button class="b" onclick="openMeta()">🪶 Nest & Unlocks</button>
    <button class="dim" onclick="openMore()">⭐ Speedrun · Trophies · Settings</button>
  </div>
  <div id="titleMeta" style="margin-top:10px;font-size:12px;color:#9aa3b5"></div>
</div>
<div id="sheet"><div class="box glass" id="sbox"></div></div>
<div id="modal"><div class="box glass" id="mbox"></div></div>

<script>

const COIN_SPR={}, SHADOW_SPR=document.createElement("canvas"), GLOW_SPR=document.createElement("canvas");

function buildSprites(){

function renderCoinSprite(kind, rot){

  c.fillStyle="rgba(255,255,255,.12)";c.fillRect(cx-rx,cy,rx*2,2);

  c.beginPath();c.ellipse(cx,cy,rx*.55,ry*.55,0,0,7);c.strokeStyle="rgba(255,255,255,.22)";c.stroke();
  // embossed stamp
  c.save();c.translate(cx,cy);c.scale(1,.45);c.rotate(rot*.15);
  c.fillStyle="rgba(0,0,0,.28)";c.font="bold 16px system-ui";c.textAlign="center";c.textBaseline="middle";
  const stamp=kind==="bomb"?"💣":kind==="magnet"?"N":kind==="multi"?"×2":kind==="golden"?"✦":kind==="sticky"?"●":kind==="split"?"✚":kind==="gold"?"G":kind==="silver"?"S":"P";
  if(stamp.length===1||stamp.length===2){c.font="bold 15px system-ui";c.fillText(stamp,0,1);c.fillStyle="rgba(255,255,255,.28)";c.fillText(stamp,0,-1)}
  else {c.font="16px system-ui";c.fillText(stamp,0,0)}
  // reed ticks on face
  c.strokeStyle="rgba(0,0,0,.15)";c.lineWidth=1;c.beginPath();

  c.strokeStyle="rgba(255,255,255,.75)";c.lineWidth=2.2;
  c.beginPath();c.ellipse(cx,cy,rx*.72,ry*.72,rot,3.5,5.15);c.stroke();
  c.fillStyle="rgba(255,255,255,.28)";c.beginPath();c.ellipse(cx-rx*.28,cy-ry*.35,rx*.22,ry*.14,rot,0,7);c.fill();

}

let PK=1, tableTop=0, tableBot=0, tableCache=null, tableKey="", pusherSpr=null;
function layoutProj(){

function proj(x,z,y){
  const t=z<0?0:z>TL?1:z/TL;

  return{sx:W/2+x*sc*PK, sy:tableTop+(tableBot-tableTop)*t-y*PK*7.5, sc:sc*PK, t};
}

  c.beginPath();c.moveTo(a.sx,a.sy);c.lineTo(b.sx,b.sy);c.lineTo(d.sx,d.sy);c.lineTo(e.sx,e.sy);c.closePath();

  const sr=c.createLinearGradient(br.sx,0,fr.sx,0);

  c.fillStyle=sr;c.beginPath();c.moveTo(br.sx,br.sy);c.lineTo(fr.sx,fr.sy);c.lineTo(fr.sx+20,fr.sy+depth);c.lineTo(br.sx+12,H*0.86);c.closePath();c.fill();

// ---------- physics v2 ----------
function hashPut(map,c,i,BIN){
  const kx=(c.x/BIN)|0,kz=(c.z/BIN)|0;
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
    const k=(kx+a)+","+(kz+b);
    let arr=map.get(k);if(!arr){arr=[];map.set(k,arr)}arr.push(i);
  }
}
function capAndMerge(){
  if(coins.length<=COIN_CAP)return;
  // merge nearest sleeping same-kind pairs
  const asleep=coins.map((c,i)=>({c,i})).filter(o=>o.c.sleep&&!o.c.falling&&!o.c.dead);
  for(let n=0;n<8 && coins.length>COIN_CAP;n++){
    let bi=-1,bj=-1,bd=1e9;
    for(let i=0;i<asleep.length;i++)for(let j=i+1;j<asleep.length;j++){
      const a=asleep[i].c,b=asleep[j].c;if(a.dead||b.dead||a.kind!==b.kind)continue;
      const d=Math.abs(a.x-b.x)+Math.abs(a.z-b.z);if(d<bd){bd=d;bi=asleep[i].i;bj=asleep[j].i}
    }
    if(bi<0){ // drop oldest sleeping
      for(let i=0;i<coins.length;i++)if(coins[i].sleep){coins[i].dead=1;break}
      coins=coins.filter(c=>!c.dead);break;
    }
    const a=coins[bi],b=coins[bj];
    a.base=(a.base||1)+(b.base||1);a.r=Math.min(14,(a.r+b.r)*0.55);b.dead=1;a.sleep=0;a.awake=1;
    coins=coins.filter(c=>!c.dead);
  }
  if(coins.length>COIN_CAP+10)coins.length=COIN_CAP;
}

function stepPhysics(dt){
  const R=G||{spd:1,fric:.12,lip:0,lucky:0,walls:0,slots:0,boom:1,mag:1,mass:1,wide:0,over:0,crit:0,multit:3,splitn:0};
  const spd=(R.spd||1)*(1+.2*ST("time"));
  const cycle=3.2/Math.max(.45,spd);
  phase+=dt/cycle;if(phase>=1)phase-=1;
  const t=phase<0.7?phase/0.7:1-(phase-0.7)/0.3;
  const ease=t*t*(3-2*t);
  const np=PMIN+(PMAX-PMIN)*ease;
  const dP=np-pusher;pusher=np;
  const pvel=dP/Math.max(dt,.008);
  const fr=Math.max(.045,Math.min(.2,R.fric));
  const damp=Math.pow(1-fr,dt*60);
  const pushW=TW/2*(1+(R.wide||0));const lip0=TL-(R.lip||0);

  // build hash of living coins
  const BIN=24, map=new Map();
  for(let i=0;i<coins.length;i++){const c=coins[i];if(c.dead)continue;c.pushed=0;hashPut(map,c,i,BIN)}

  for(const c of coins){
    if(c.dead)continue;
    // falling off front / gutter
    if(c.falling){
      c.fallT+=dt;c.vy-=700*dt;c.y+=c.vy*dt;
      if(c.falling==="front"){c.z+=Math.max(40,c.vz)*dt;c.vz+=60*dt}
      else {c.x+=Math.sign(c.fallDir||1)*90*dt;c.y-=20*dt}
      c.spin+=dt*8;
      if(c.fallT>0.45||c.y<-28){
        if(c.falling==="front"&&G)cashCoin(c,c._slot);
        else if(G){c.falling=0;gutterCoin(c)}
        else c.dead=1;
      }
      continue;
    }
    // sleeping coins on the static lip can skip most work unless the shelf is about to hit them
    if(c.sleep && !c.falling && c.y<=TH*0.2 && c.z>pusher+c.r+2 && Math.abs(dP)<1e-5){
      if(c.z>lip0-c.r*0.55 && (c.z>lip0-3)){c.sleep=0;}
      else continue;
    }
    // shelf carry
    const onShelf=c.y<=TH*0.6+0.2 && c.z+c.r*0.15<=pusher+0.2 && Math.abs(c.x)<=pushW+c.r;
    if(onShelf){
      if(dP>0){c.z+=dP;c.pushed=1;c.sleep=0}
      else if(c.z<pusher){c.z+=dP;c.pushed=1}
    }else if(c.y<=TH && dP>0){
      const face=pusher;
      if(c.z-c.r<face && c.z+c.r>face-22){
        c.z=Math.max(c.z,face+c.r*0.9);
        c.vz=Math.max(c.vz,pvel*0.7);
        c.sleep=0;c.pushed=1;c.awake=1;
      }
    }
    // gravity / stacking support
    const sup=findSupport(c,map,BIN);
    if(c.y>TH*10){c.y=0;c.vy=0;}c.vy-=620*dt;c.y+=c.vy*dt;
    if(c.y<=sup.y){
      c.y=sup.y;
      if(c.vy<0){
        if(c.vy<-90){c.vy*=-0.18;sfx("clink")}else c.vy=0;
        if(c.landed!==1){c.landed=1;onLand(c);if(c.dead)continue}
      }
      // topple if barely supported
      if(sup.on && sup.ov<0.38*c.r){
        const dx=c.x-sup.on.x,dz=c.z-sup.on.z,d=Math.hypot(dx,dz)+.01;
        c.vx+=dx/d*40*dt*60;c.vz+=dz/d*40*dt*60;c.sleep=0;
      }else if(sup.on){
        c.vx+=(sup.on.vx-c.vx)*0.35;c.vz+=(sup.on.vz-c.vz)*0.35;
      }
    }
    c.x+=c.vx*dt;c.z+=c.vz*dt;c.spin+=dt*c.vx*0.04;
    if(c.y<=sup.y+0.05){c.vx*=damp;c.vz*=damp;if(Math.hypot(c.vx,c.vz)<3&&c.vy===0&&!c.pushed){c.vx=0;c.vz=0;c.sleep=1}else c.sleep=0}
    else c.sleep=0;
    if(c.z-c.r<2){c.z=2+c.r;c.vz=Math.abs(c.vz)*0.3;c.sleep=0}
    if(c.kind==="magnet"&&c.y<=TH&&G)doMagnetHash(c,dt,map,BIN);
    if(c.kind==="sticky"&&c.y<=TH)stickNear(c,map,BIN);
    if(c.mt){c.mt-=dt;if(c.mt<=0)c.mult=0}
    // teeter / fall front
    const lip=TL-(R.lip||0);
    if(c.z>lip-c.r*0.55){
      if(c.z>lip-3 || c.vz>5){
        if(!G){c.dead=1;continue}
        let slot=0;if(R.slots){const n=(c.x+TW/2)/TW;if(Math.abs(n-0.28)<.06||Math.abs(n-0.72)<.06)slot=1}
        c.falling="front";c.fallT=0;c._slot=slot;c.vy=Math.max(c.vy,8);c.sleep=0;continue;
      }
    }
    if(Math.abs(c.x)+c.r*0.55>halfW(c.z)+2){
      if(!G){c.dead=1;continue}
      if(Math.random()<G.lucky||G.walls){gutterCoin(c);if(!c.dead)continue}
      c.falling="gutter";c.fallDir=Math.sign(c.x)||1;c.fallT=0;c.sleep=0;
    }
  }

  // same-layer collisions via hash
  const seen=new Set();
  for(const arr of map.values()){
    for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){
      const ia=arr[i],ib=arr[j];
      const a=coins[ia],b=coins[ib];if(!a||!b||a.dead||b.dead||a.falling||b.falling)continue;
      if(a.sleep&&b.sleep)continue;
      if(Math.abs(a.y-b.y)>TH*0.75)continue;
      const id=ia<ib?ia+"-"+ib:ib+"-"+ia;if(seen.has(id))continue;seen.add(id);
      const dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz,min=a.r+b.r;if(d2>=min*min||d2===0)continue;
      const d=Math.sqrt(d2),o=min-d,nx=dx/d,nz=dz/d,m1=a.mass||1,m2=b.mass||1,s=o/(m1+m2);
      a.x-=nx*s*m2;a.z-=nz*s*m2;b.x+=nx*s*m1;b.z+=nz*s*m1;
      const rv=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;
      if(rv<0){const imp=-(1.22)*rv/(1/m1+1/m2);a.vx-=imp*nx/m1;a.vz-=imp*nz/m1;b.vx+=imp*nx/m2;b.vz+=imp*nz/m2;a.sleep=0;b.sleep=0;if(Q>=.8&&Math.random()<.05)sfx("clink")}
      if(a.kind==="multi"||b.kind==="multi"){const t=a.kind==="multi"?a:b,o2=t===a?b:a;o2.mult=Math.max(o2.mult||0,2);o2.mt=R.multit||3}
    }
  }
  // solid pusher face
  for(const c of coins){
    if(c.dead||c.falling||c.y>TH)continue;
    if(c.z>=pusher-0.5 && c.z-c.r<pusher){
      c.z=pusher+c.r*0.98;
      if(pvel>0){c.vz=Math.max(c.vz,pvel*0.75);c.sleep=0;c.pushed=1}
    }
  }

  if(!G){recycleDead();return}

  for(const p of prizes){
    p.vx=p.vx||0;p.vz=p.vz||0;
    const onShelf=p.z+8<=pusher;
    if(onShelf){if(dP>0)p.z+=dP;else if(p.z<pusher)p.z+=dP}
    else if(dP>0&&p.z-12<pusher&&p.z>pusher-16){p.z=pusher+12;p.vz=Math.max(p.vz,pvel*0.4)}
    p.x+=p.vx*dt;p.z+=p.vz*dt;p.vx*=damp;p.vz*=damp;
    if(p.z>TL-4){collectPrize(p);p.dead=1}
    if(Math.abs(p.x)>halfW(p.z)+8)p.dead=1;
    // light collide vs nearby coins only
    const kx=(p.x/BIN)|0,kz=(p.z/BIN)|0;
    const near=map.get(kx+","+kz)||[];
    for(const i of near){const c=coins[i];if(!c||c.dead||c.falling)continue;const dx=c.x-p.x,dz=c.z-p.z,d=Math.hypot(dx,dz),min=c.r+p.r;if(d<min&&d>0){const o=(min-d);c.x+=dx/d*o*.5;c.z+=dz/d*o*.5;p.x-=dx/d*o*.5;p.z-=dz/d*o*.5;c.sleep=0}}
  }
  prizes=prizes.filter(p=>!p.dead);
  recycleDead();
  capAndMerge();
  // particles
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.z+=p.vz*dt;p.y+=p.vy*dt;p.vy-=400*dt;p.l-=dt;if(p.l<=0){parts.splice(i,1);partPool.push(p)}}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=30*dt;f.l-=dt;if(f.l<=0){floats.splice(i,1);floatPool.push(f)}}
  shake*=.88;flash*=.92;
}

function recycleDead(){
  if(!coins.some(c=>c.dead))return;
  coins=coins.filter(c=>!c.dead);
}

function findSupport(c,map,BIN){
  let bestY=0,best=null,bestOv=0;
  const kx=(c.x/BIN)|0,kz=(c.z/BIN)|0;
  const near=map.get(kx+","+kz);
  if(near){
    for(const i of near){
      const o=coins[i];if(!o||o===c||o.dead||o.falling)continue;
      if(o.y>=c.y-0.2)continue; // must already be below — prevents mutual climbing
      const top=o.y+o.thick;
      if(top<bestY-0.2)continue;
      const dx=c.x-o.x,dz=c.z-o.z,d=Math.hypot(dx,dz),need=c.r+o.r;
      const ov=need-d;
      if(ov>0.32*Math.min(c.r,o.r)){
        if(top>=bestY){bestY=top;best=o;bestOv=ov}
      }
    }
  }
  if(bestY>TH*8)bestY=TH*8; // max stack
  return{y:bestY,on:best,ov:bestOv};
}
function doMagnetHash(c,dt,map,BIN){
  const R=80*(G.mag||1);
  const near=map.get(((c.x/BIN)|0)+","+((c.z/BIN)|0))||[];
  for(const i of near){const o=coins[i];if(!o||o===c||o.dead||o.falling)continue;const dx=c.x-o.x,dz=c.z-o.z,d=Math.hypot(dx,dz)+.01;if(d<R){const f=140*(G.mag||1)*dt/d;o.vx+=dx*f;o.vz+=dz*f;o.sleep=0}}
}
function stickNear(c,map,BIN){
  const near=map.get(((c.x/BIN)|0)+","+((c.z/BIN)|0))||[];
  for(const i of near){const o=coins[i];if(!o||o===c||o.dead)continue;const d=Math.hypot(o.x-c.x,o.z-c.z);if(d<c.r+o.r+2){o.vx+=(c.vx-o.vx)*0.15;o.vz+=(c.vz-o.vz)*0.15;o.sleep=0}}
}

// ---------- loop ----------
let mode="title", lastT=performance.now(), fpsA=0,fpsN=0,FPS=60, autoT=0, uiT=0, hudKey="";
let fast=0;
function adaptQ(){
  if(FPS<42){fpsLow++;fpsHigh=0;if(fpsLow>2)Q=Math.max(.35,Q-0.2),fpsLow=0}
  else if(FPS>56){fpsHigh++;fpsLow=0;if(fpsHigh>3)Q=Math.min(1,Q+0.2),fpsHigh=0}
  else {fpsLow=0;fpsHigh=0}
}
function frame(now){
  const raw=Math.min(.05,(now-lastT)/1000);lastT=now;
  fpsA+=raw;fpsN++;if(fpsA>=1){FPS=Math.round(fpsN/fpsA);fpsA=0;fpsN=0;adaptQ()}
  if(mode==="play"&&G){
    const n=fast?fast:0;
    if(n){for(let i=0;i<n;i++){G.rt+=DT;stepPhysics(DT);stepPlay(DT)}}
    else{
      acc+=raw;let s=0;
      while(acc>=DT&&s<2){G.rt+=DT;stepPhysics(DT);stepPlay(DT);acc-=DT;s++}
      if(acc>DT*2)acc=0;
    }
  }else if(mode==="title"){
    if(!coins.length){G=baseRun();resetTable();G=null;tableKey=""}
    acc+=raw;while(acc>=DT){stepPhysics(DT);acc-=DT}
    if(acc>DT*2)acc=0;
  }
  draw(now);
  requestAnimationFrame(frame);

function roundWin(){
  if(G._lock)return;G._lock=1;
  if(G.lives===1&&G.livesMax>1)M.st.comeback=1;
  if(G.guttered===0)M.st.clean++;
  M.st.rounds++;M.st.bestF=Math.max(M.st.bestF,G.floor);
  if(G.interest)G.shine+=Math.floor(G.shine/8)*G.interest;
  const feat=Math.round((4+G.floor*1.2+G.cashedR*0.15)*(1+.1*U("shine"))*(1+.25*B("feath"))*Math.pow(1.5,ST("crest3")));
  M.feathers+=feat;G._feat=feat;
  G.splits.push({f:G.floor,t:G.rt,boss:G.boss});
  if(G.boss)M.st.bosses++;
  banner(G.floor===20?"🏰 Vault cleared!":"Quota met!");
  sfx("ok");
  if(G.floor===20&&!G.endless){G.won=1;M.st.vaults++;recordRun();victoryScreen();return}
  openShop();
  checkAch();save();

function autoDrop(){
  if(mode!=="play"||G.drops<=0)return;
  // aim near densest x on the pusher
  let best=0,bs=-1;
  for(let x=-TW/2+20;x<TW/2-20;x+=16){let s=0;for(const c of coins){if(c.z<pusher+40)s+=1/(1+Math.abs(c.x-x)*0.05)}if(s>bs){bs=s;best=x}}
  // pick special if useful
  if((G.bag.bomb||0)>0&&coins.length>12&&Math.random()<.3)dropAt(best,"bomb");
  else if((G.bag.magnet||0)>0&&Math.random()<.2)dropAt(best,"magnet");
  else if((G.bag.split||0)>0&&Math.random()<.2)dropAt(best,"split");
  else if((G.bag.golden||0)>0&&Math.random()<.15)dropAt(best,"golden");
  else if((G.bag.multi||0)>0&&Math.random()<.2)dropAt(best,"multi");
  else dropAt(best,haveType(selType)?selType:"std");
}

function haveType(k){if(k==="std")return true;return (G.bag[k]||0)>0}
function dropAt(x,kind){
  if(!G||mode!=="play"||G.drops<=0)return false;
  kind=kind||selType||"std";
  if(!haveType(kind))kind="std";
  if(kind!=="std")G.bag[kind]--;
  G.drops--;G.restT=0;
  const z=dropZ();
  const sc=G.scatter;
  const c=mkCoin(x+(Math.random()-.5)*sc*0.12,z+(Math.random()-.5)*5,kind,{y:48,vy:-8,vx:(Math.random()-.5)*sc*0.55,vz:8+Math.random()*14,trail:1});
  coins.push(c);renderTypes();renderHUD();return true;
}

function screenToX(sx,sy){
  // invert proj roughly at drop Z
  const z=dropZ();const p0=proj(-TW/2,z,0),p1=proj(TW/2,z,0);
  const t=(sx-p0.sx)/(p1.sx-p0.sx||1);
  let x=-TW/2+t*TW;
  const lim=G&&G.narrow?TW*0.22:TW*0.46;
  return Math.max(-lim,Math.min(lim,x));
}

let shopItems=[];
function rollShop(){
  const n=3+U("shop3");
  const pool=SHOP.filter(it=>{
    if(it.need&&!it.need(G))return false;
    const owned=G.relics.filter(r=>r.k===it.k).length;
    return owned<it.stack;
  });
  shopItems=[];
  const bag=pool.slice();
  for(let i=0;i<n&&bag.length;i++){
    const w=bag.map(it=>[0.55,0.28,0.13,0.04][it.r]);
    const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,pick=0;
    for(let j=0;j<bag.length;j++){r-=w[j];if(r<=0){pick=j;break}}
    shopItems.push(bag.splice(pick,1)[0]);
  }
}
function renderShop(){
  const cards=shopItems.map((it,i)=>{
    const r=RAR[it.r],c=priceOf(it);
    return `<div class="card ${r}"><div class="ic">${it.ic}</div><div class="tx"><span class="rare-tag">${r}</span><b>${it.n}</b>${it.d}</div>
      <button class="g" ${G.shine>=c?"":"disabled"} onclick="buyShop(${i})">✨${c}</button></div>`;
  }).join("");
  showSheet(`<h2>🛒 Wayside Stall</h2>
    <p style="text-align:center;margin:0 0 8px;color:#c9b48a">Floor ${G.floor} cleared · ✨ ${G.shine} shine · 🪶 +${G._feat||0}</p>

}

  if(moreSeg==="set"){
    body=`<h2>⚙️ Settings</h2>
      <div class="row"><div class="tx"><b>Particles & effects</b></div><button onclick="M.set.fx^=1;save();openMore()">${M.set.fx?"On":"Off"}</button></div>
      <div class="row"><div class="tx"><b>Screen shake</b></div><button onclick="M.set.shake^=1;save();openMore()">${M.set.shake?"On":"Off"}</button></div>
      <div class="row"><div class="tx"><b>Sound (clinks)</b></div><button onclick="M.set.snd^=1;save();openMore()">${M.set.snd?"On":"Off"}</button></div>
      <div class="row"><div class="tx"><b>Save</b>Autosaves on events</div><button onclick="save();toast('Saved 💾')">Save</button><button onclick="exportSave()">Export</button><button onclick="importSave()">Import</button></div>
      <div class="row"><div class="tx"><b>Hard reset</b>Wipes everything</div><button class="r" onclick="hardReset()">Reset</button></div>
      <div style="font-size:11px;color:#789">Gleamshelf v${VER} · no ads, no tracking · ${FPS} fps<br>An original game. Not affiliated with any console title.</div>`;
  }
  showSheet(`<div class="seg">${seg("speed","⏱ Speedrun")}${seg("ach","🏆 Trophies")}${seg("set","⚙️ Settings")}</div>${body}
    <button class="dim" style="width:100%;margin-top:8px" onclick="closeSheet();if(mode==='pause'){mode='play'}">Close</button>`);
}
window.openMore=openMore;
window.copySplits=()=>{const t="Gleamshelf\n"+(G?G.splits.map(s=>"Floor "+s.f+": "+fmtT(s.t)).join("\n"):"")+(M.lb[0]?"\nBest vault: "+fmtT(M.lb[0].t):"");try{navigator.clipboard.writeText(t)}catch(e){}toast("Copied 📋")};
window.exportSave=()=>{const s=btoa(unescape(encodeURIComponent(JSON.stringify(M))));try{navigator.clipboard.writeText(s)}catch(e){}showModal(`<h2>Export</h2><textarea style="width:100%;height:120px;font-size:9px">${s}</textarea><button onclick="closeModal()">Close</button>`)};
window.importSave=()=>{const s=prompt("Paste save");if(!s)return;try{M=Object.assign(freshMeta(),JSON.parse(decodeURIComponent(escape(atob(s.trim())))));save();toast("Imported ✅");updateTitle()}catch(e){toast("Bad save","#f88")}};
window.hardReset=()=>{showModal(`<h2>Hard reset?</h2><p>This deletes ALL feathers, Crests, Stars, unlocks and records.</p><div style="display:flex;gap:8px;justify-content:center"><button class="dim" onclick="closeModal()">Cancel</button><button class="r" onclick="localStorage.removeItem(SK);M=freshMeta();save();closeModal();closeSheet();goTitle();toast('Wiped')">Delete</button></div>`)};

function checkAch(){let hit=0;for(const a of ACH)if(!M.ach[a[0]]&&a[3](M)){M.ach[a[0]]=1;hit=1;toast("🏆 "+a[1],"#f6d365")}if(hit)save()}

window.startRun=startRun;window.goTitle=goTitle;window.toggleAuto=toggleAuto;window.enterEndless=enterEndless;

// boot
updateTitle();
// preview coins
G=baseRun();resetTable();G=null;
requestAnimationFrame(frame);

window.__gs={
  get G(){return G},get M(){return M},get coins(){return coins},get mode(){return mode},get FPS(){return FPS},get pusher(){return pusher},
  VER,startRun,dropAt,startFloor,nextFloor,openShop,leaveShop,buyShop,doReroll,goTitle,
  stepPhysics,setFast(n){fast=n},
  tick(seconds){const n=Math.ceil(seconds*60);for(let i=0;i<n;i++){if(G&&mode==="play"){G.rt+=1/60;if(G.drops<=0&&!aiming)G.restT=(G.restT||0)+1/60;else G.restT=0}stepPhysics(1/60)}if(typeof checkRoundEnd==="function")checkRoundEnd()},setMode(m){mode=m},quotaFor,isBoss,
  fillShine(n){if(G)G.shine=n},setScore(n){if(G)G.score=n},winRound(){roundWin()},
  bag(){return G&&G.bag},sel(k){selType=k;renderTypes()},
  forceQuota(){if(G)G.quota=Math.max(1,G.quota)},
  settle(){for(let i=0;i<180;i++)stepPhysics(1/60)},
  clearTable(){coins=[]},
  spawn:spawnOnTable,mkCoin,cashAll(){for(const c of coins.slice()){c.z=TL+1}stepPhysics(1/60)},
  get shopItems(){return shopItems},
  crestGain,starGain,doMoult:()=>window.confirmMoult(crestGain()),doSky:()=>window.confirmSky(starGain(),crestGain()),
  closeSheet,closeModal,openMeta,openMore,checkAch,save,checkRoundEnd,roundWin,roundFail,get parts(){return parts},get Q(){return Q},
  TL,TW
};

</script></body></html>
